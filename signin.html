<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة تسجيل الدخول الموحد | Alislamiah AI</title>
    <!-- استيراد خطوط ومستندات احترافية -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at top right, #1a2a6c, #275d38, #0f2027);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* كارت احترافي بتأثير زجاجي Glassmorphism */
        .auth-card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
            width: 90%;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .auth-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 60px rgba(40, 167, 69, 0.2);
        }

        /* لوجو تخيلي ذكي ونظيف */
        .logo-area {
            font-size: 28px;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .logo-area span {
            color: #28a745; /* الزمردي */
            text-shadow: 0 0 15px rgba(40, 167, 69, 0.6);
        }

        .subtitle {
            color: #b0c4de;
            font-size: 14px;
            margin-bottom: 35px;
        }

        /* زر التسجيل بتصميم احترافي خارق */
        .btn-sso {
            position: relative;
            background: linear-gradient(135deg, #28a745, #1e7e34);
            color: #ffffff;
            border: none;
            padding: 16px 32px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 14px;
            cursor: pointer;
            white-space: nowrap;
            width: 100%;
            box-shadow: 0 8px 20px rgba(40, 167, 69, 0.3);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-sso:hover {
            background: linear-gradient(135deg, #218838, #19692c);
            box-shadow: 0 12px 28px rgba(40, 167, 69, 0.5);
            transform: scale(1.02);
        }

        .btn-sso:active {
            transform: scale(0.99);
        }

        /* أنيميشن التحميل عند التوجيه التلقائي المباشر */
        .loader {
            display: none;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #28a745;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            display: none;
            color: #ffffff;
            font-size: 15px;
            margin-top: 15px;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="auth-card" id="cardBox">
    <div class="logo-area">Alislamiah <span>AI</span></div>
    <div class="subtitle">بوابة التحقق الفوري والآمن للمنصات</div>
    
    <!-- الزر الرئيسي الاحترافي -->
    <button id="ssoAuthBtn" class="btn-sso">
        Sign in with Alislamiah AI
    </button>

    <!-- عناصر الواجهة الصامتة للتحميل المباشر -->
    <div class="loader" id="spinner"></div>
    <div class="loading-text" id="spinnerText">جاري توجيهك بأمان إلى الرئيسية...</div>
</div>

<script>
// العناصر الرسومية للتحكم بالأنيميشن والاحترافية
const authBtn = document.getElementById('ssoAuthBtn');
const spinner = document.getElementById('spinner');
const spinnerText = document.getElementById('spinnerText');

// 1. الفحص الفوري بمجرد الرجوع للصفحة أو تحميلها مجدداً
window.addEventListener('DOMContentLoaded', function() {
    if (localStorage.getItem('alislamiah_auth_state') === 'authorized') {
        // إخفاء الزر وإظهار تأثير التحميل الاحترافي ليرى المستخدم أن هناك معالجة ذكية تحدث
        authBtn.style.display = 'none';
        spinner.style.display = 'block';
        spinnerText.style.display = 'block';

        // تنظيف العلامة لمنع التوجيه اللانهائي مستقبلاً
        localStorage.removeItem('alislamiah_auth_state');
        
        // التحويل المباشر والصامت إلى رئيسية تيوب بعد فترة تأخير بسيطة جداً (0.5 ثانية) للمظهر الجمالي فقط
        setTimeout(function() {
            window.location.replace("https://github.io");
        }, 500);
    }
});

// 2. معالجة الضغط على زر الدخول الموحد المحدث
authBtn.addEventListener('click', function() {
    // زرع العلامة في الذاكرة ليفهمها الكود عند الرجوع
    localStorage.setItem('alislamiah_auth_state', 'authorized');
    
    // التوجيه المباشر وفوراً لصفحة تسجيل دخول الذكاء الاصطناعي
    window.location.href = "https://github.io";
});
</script>

</body>
</html>
