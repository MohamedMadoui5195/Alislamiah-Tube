<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alislamiah AI Authentication</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .auth-container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .btn-auth {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 28px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-auth:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="auth-container">
    <!-- الزر الوحيد في الصفحة كما طلبت -->
    <button id="authBtn" class="btn-auth">Sign in with Alislamiah AI</button>
</div>

<script>
// 1. الفحص التلقائي الفوري عند تحميل الصفحة أو الرجوع إليها
window.addEventListener('DOMContentLoaded', function() {
    if (localStorage.getItem('oauth_process') === 'active') {
        // تنظيف الحالة مباشرة لمنع التوجيه اللانهائي في المستقبل
        localStorage.removeItem('oauth_process');
        
        // التحويل المباشر والصامت إلى رئيسية تيوب
        window.location.replace("https://github.io");
    }
});

// 2. معالجة حدث الضغط على زر تسجيل الدخول
document.getElementById('authBtn').addEventListener('click', function() {
    // وضع علامة في المتصفح تفيد بأن المستخدم انتقل للتسجيل
    localStorage.setItem('oauth_process', 'active');
    
    // توجيه المستخدم مباشرة إلى صفحة تسجيل الدخول المطلوبة
    window.location.href = "https://github.io";
});
</script>

</body>
</html>
