<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Alislamiah Tube - تسجيل الدخول</title>

<link rel="icon" href="icon.png">

<style>

*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
background:
radial-gradient(circle at top,#0d3264,#041225 48%,#020812);
color:#fff;
font-family:Arial,sans-serif;
display:flex;
align-items:center;
justify-content:center;
padding:18px;
}

.box{
width:100%;
max-width:430px;
background:rgba(5,19,40,.95);
border:1px solid #1b4778;
border-radius:27px;
padding:33px 23px;
box-shadow:0 25px 70px #0009;
}

.logo{text-align:center}

.logo img{
width:84px;
height:84px;
border-radius:21px;
object-fit:contain;
}

h1{
text-align:center;
margin:16px 0 7px;
font-size:25px;
}

.sub{
text-align:center;
color:#9db4d1;
font-size:14px;
margin-bottom:26px;
}

.field{
margin:16px 0;
}

label{
display:block;
font-size:14px;
margin-bottom:7px;
color:#dbe8f7;
}

input{
width:100%;
height:52px;
border-radius:14px;
border:1px solid #193c64;
background:#091d38;
color:#fff;
padding:0 15px;
outline:none;
font-size:15px;
}

input:focus{
border-color:#2b8cff;
box-shadow:0 0 0 3px #1680ff18;
}

.btn{
width:100%;
height:53px;
border:0;
border-radius:15px;
background:linear-gradient(135deg,#2180ff,#0752c7);
color:#fff;
font-size:16px;
font-weight:bold;
margin-top:7px;
cursor:pointer;
}

.msg{
text-align:center;
min-height:25px;
margin:14px 0;
font-size:14px;
line-height:1.6;
}

.err{color:#ff7777}
.ok{color:#54e39a}

.bottom{
text-align:center;
color:#9bb1cb;
font-size:14px;
margin-top:18px;
}

.link{
background:none;
border:0;
color:#4c9cff;
font-weight:bold;
cursor:pointer;
font-size:14px;
}

.langs{
display:flex;
justify-content:center;
gap:7px;
margin-top:22px;
}

.langs button{
background:#071a34;
color:#a5bad3;
border:1px solid #20446d;
border-radius:9px;
padding:7px 10px;
cursor:pointer;
}

.langs .active{
background:#125dc9;
color:#fff;
border-color:#318aff;
}

/* نافذة حفظ كلمة المرور */

.modal{
display:none;
position:fixed;
inset:0;
background:#000b;
backdrop-filter:blur(5px);
align-items:center;
justify-content:center;
padding:18px;
z-index:5;
}

.card{
width:100%;
max-width:370px;
background:#071a34;
border:1px solid #28537e;
border-radius:22px;
padding:25px;
text-align:center;
box-shadow:0 20px 60px #000b;
}

.ico{
font-size:37px;
}

.card h2{
font-size:20px;
margin:10px 0;
}

.card p{
color:#9db4d1;
font-size:14px;
line-height:1.7;
}

.actions{
display:flex;
gap:10px;
margin-top:20px;
}

.actions button{
flex:1;
height:46px;
border-radius:12px;
font-weight:bold;
cursor:pointer;
}

.yes{
background:#1769df;
border:0;
color:white;
}

.no{
background:#0b213d;
border:1px solid #315276;
color:white;
}

</style>
</head>

<body>

<div class="box">

<div class="logo">
<img src="icon.png" alt="Alislamiah Tube">
</div>

<h1 id="title">تسجيل الدخول</h1>

<div class="sub" id="sub">
سجّل الدخول إلى Alislamiah Tube
</div>

<form id="form">

<div class="field">

<label id="accountL">
البريد الإلكتروني أو رقم الهاتف
</label>

<input
id="account"
required
autocomplete="username"
>

</div>

<div class="field">

<label id="passL">
كلمة المرور
</label>

<input
id="pass"
type="password"
required
autocomplete="current-password"
>

</div>

<button class="btn" id="login">
تسجيل الدخول
</button>

</form>

<div id="msg" class="msg"></div>

<div class="bottom">

<span id="noAccount">
ليس لديك حساب؟
</span>

<button
class="link"
onclick="location.href='signup.html'"
id="signup"
>
إنشاء حساب
</button>

</div>

<div class="langs">

<button data-l="ar">العربية</button>
<button data-l="fr">Français</button>
<button data-l="en">English</button>

</div>

</div>


<!-- نافذة الحفظ -->

<div class="modal" id="modal">

<div class="card">

<div class="ico">🔐</div>

<h2 id="saveTitle">
هل تريد حفظ كلمة المرور؟
</h2>

<p id="saveText">
سيتم حفظها على هذا الجهاز ويمكنك الوصول إليها لاحقًا من صفحة كلمات المرور المحفوظة.
</p>

<div class="actions">

<button class="yes" id="yes">
نعم، حفظها
</button>

<button class="no" id="no">
لا، شكرًا
</button>

</div>

</div>

</div>


<script>

const USERS_KEY="alislamiah_tube_users";
const SESSION_KEY="alislamiah_tube_session";
const SAVED_KEY="alislamiah_tube_saved_passwords";
const LANG_KEY="alislamiah_tube_lang";


function getUsers(){

try{

const users=
JSON.parse(
localStorage.getItem(USERS_KEY)||"[]"
);

return Array.isArray(users)?users:[];

}catch{

return [];

}

}


function normalizeEmail(v){

return String(v||"")
.trim()
.toLowerCase();

}


function normalizePhone(v){

return String(v||"")
.replace(/\s+/g,"")
.trim();

}


function findUser(account){

const value=String(account||"").trim();

const email=normalizeEmail(value);
const phone=normalizePhone(value);

return getUsers().find(user=>

normalizeEmail(user.email)===email ||
normalizePhone(user.phone)===phone

)||null;

}


function setSession(user){

localStorage.setItem(
SESSION_KEY,
JSON.stringify({

id:user.id,
email:user.email,
phone:user.phone,
name:user.name||"",
loggedIn:true,
time:Date.now()

})
);

}


function savePasswordForUser(user,password){

let list=[];

try{

list=
JSON.parse(
localStorage.getItem(SAVED_KEY)||"[]"
);

}catch{

list=[];

}

if(!Array.isArray(list)){
list=[];
}

list=list.filter(
item=>item.userId!==user.id
);

list.push({

userId:user.id,
email:user.email,
phone:user.phone,
password:password,
savedAt:Date.now()

});

localStorage.setItem(
SAVED_KEY,
JSON.stringify(list)
);

}


const T={

ar:{
title:"تسجيل الدخول",
sub:"سجّل الدخول إلى Alislamiah Tube",
account:"البريد الإلكتروني أو رقم الهاتف",
pass:"كلمة المرور",
login:"تسجيل الدخول",
no:"ليس لديك حساب؟",
signup:"إنشاء حساب",
empty:"يرجى إدخال بيانات الدخول.",
notfound:"الحساب غير موجود. أنشئ حسابًا جديدًا.",
wrong:"كلمة المرور غير صحيحة.",
ok:"تم تسجيل الدخول بنجاح.",
saveTitle:"هل تريد حفظ كلمة المرور؟",
saveText:"سيتم حفظها على هذا الجهاز ويمكنك الوصول إليها لاحقًا من صفحة كلمات المرور المحفوظة.",
yes:"نعم، حفظها",
noSave:"لا، شكرًا"
},

fr:{
title:"Connexion",
sub:"Connectez-vous à Alislamiah Tube",
account:"E-mail ou numéro de téléphone",
pass:"Mot de passe",
login:"Se connecter",
no:"Vous n'avez pas de compte ?",
signup:"Créer un compte",
empty:"Veuillez saisir vos identifiants.",
notfound:"Compte introuvable. Créez un compte.",
wrong:"Mot de passe incorrect.",
ok:"Connexion réussie.",
saveTitle:"Voulez-vous enregistrer le mot de passe ?",
saveText:"Il sera enregistré sur cet appareil et accessible depuis la page des mots de passe enregistrés.",
yes:"Oui, enregistrer",
noSave:"Non, merci"
},

en:{
title:"Sign in",
sub:"Sign in to Alislamiah Tube",
account:"Email or phone number",
pass:"Password",
login:"Sign in",
no:"Don't have an account?",
signup:"Create account",
empty:"Please enter your login details.",
notfound:"Account not found. Create an account.",
wrong:"Incorrect password.",
ok:"Signed in successfully.",
saveTitle:"Do you want to save your password?",
saveText:"It will be saved on this device and accessible from the saved passwords page.",
yes:"Yes, save it",
noSave:"No, thanks"
}

};


let lang=
localStorage.getItem(LANG_KEY)||"ar";

let loggedUser=null;
let enteredPassword="";


function applyLanguage(){

const t=T[lang];

document.documentElement.lang=lang;

document.documentElement.dir=
lang==="ar"?"rtl":"ltr";

document.getElementById("title").textContent=t.title;
document.getElementById("sub").textContent=t.sub;
document.getElementById("accountL").textContent=t.account;
document.getElementById("passL").textContent=t.pass;
document.getElementById("login").textContent=t.login;
document.getElementById("noAccount").textContent=t.no;
document.getElementById("signup").textContent=t.signup;

document.getElementById("saveTitle").textContent=t.saveTitle;
document.getElementById("saveText").textContent=t.saveText;
document.getElementById("yes").textContent=t.yes;
document.getElementById("no").textContent=t.noSave;

document.querySelectorAll(".langs button")
.forEach(button=>{

button.classList.toggle(
"active",
button.dataset.l===lang
);

});

}


document.querySelectorAll(".langs button")
.forEach(button=>{

button.onclick=()=>{

lang=button.dataset.l;

localStorage.setItem(
LANG_KEY,
lang
);

applyLanguage();

};

});


document.getElementById("form").onsubmit=function(e){

e.preventDefault();

const t=T[lang];

const account=
document.getElementById("account").value.trim();

const password=
document.getElementById("pass").value;

const msg=
document.getElementById("msg");

msg.className="msg";
msg.textContent="";


if(!account||!password){

msg.className="msg err";
msg.textContent=t.empty;

return;

}


const user=findUser(account);


if(!user){

msg.className="msg err";
msg.textContent=t.notfound;

return;

}


if(user.password!==password){

msg.className="msg err";
msg.textContent=t.wrong;

return;

}


loggedUser=user;
enteredPassword=password;

setSession(user);

msg.className="msg ok";
msg.textContent=t.ok;


setTimeout(()=>{

document.getElementById("modal")
.style.display="flex";

},250);

};


function finishLogin(){

location.href="index.html";

}


document.getElementById("yes").onclick=()=>{

savePasswordForUser(
loggedUser,
enteredPassword
);

finishLogin();

};


document.getElementById("no").onclick=()=>{

finishLogin();

};


applyLanguage();

</script>

</body>
</html>
