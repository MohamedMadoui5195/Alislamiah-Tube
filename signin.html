<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - Alislamiah-Tube</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary-color: #0f766e;
      --primary-hover: #0d9488;
      --bg-gradient: linear-gradient(135deg, #07111f 0%, #0b1a2c 100%);
      --card-bg: rgba(11, 26, 44, 0.85);
      --text-main: #f8fafc;
      --text-muted: #718ba6;
      --border-color: #173553;
      --input-bg: rgba(7, 17, 31, 0.7);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text-main);
      padding: 20px;
    }

    .auth-container {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .brand-header { text-align: center; margin-bottom: 30px; }
    .brand-logo { font-size: 2.5rem; color: #6fb7ff; margin-bottom: 10px; }
    .brand-title { font-size: 1.5rem; font-weight: 800; }
    .brand-subtitle { font-size: 0.9rem; color: var(--text-muted); margin-top: 5px; }

    .auth-tabs {
      display: flex;
      background: rgba(7, 17, 31, 0.5);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 25px;
      border: 1px solid var(--border-color);
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.3s ease;
    }

    .tab-btn.active {
      background: #1678c9;
      color: #fff;
    }

    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; color: var(--text-muted); }

    .input-wrapper { position: relative; }
    .input-wrapper i { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

    .form-input {
      width: 100%;
      padding: 12px 42px 12px 16px;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    .form-input:focus { border-color: #6fb7ff; }

    .options-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .remember-me { display: flex; align-items: center; gap: 8px; cursor: pointer; }

    .submit-btn {
      width: 100%;
      padding: 12px;
      background: #1678c9;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .submit-btn:hover { background: #1469b0; }
    .form-box { display: none; }
    .form-box.active { display: block; }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="brand-header">
      <div class="brand-logo"><i class="fa-solid fa-play-circle"></i></div>
      <div class="brand-title">Alislamiah-Tube</div>
      <div class="brand-subtitle">بوابتك للمحتوى الهادف والموثوق</div>
    </div>

    <div class="auth-tabs">
      <button class="tab-btn active" onclick="switchTab('login')">تسجيل الدخول</button>
      <button class="tab-btn" onclick="switchTab('register')">حساب جديد</button>
    </div>

    <!-- تسجيل الدخول -->
    <form id="loginForm" class="form-box active" onsubmit="handleAuth(event, 'login')">
      <div class="form-group">
        <label>البريد الإلكتروني</label>
        <div class="input-wrapper">
          <i class="fa-regular fa-envelope"></i>
          <input type="email" id="loginEmail" class="form-input" placeholder="name@example.com" required>
        </div>
      </div>

      <div class="form-group">
        <label>كلمة المرور</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" required>
        </div>
      </div>

      <div class="options-row">
        <label class="remember-me">
          <input type="checkbox" id="rememberMe">
          <span>حفظ كلمة المرور</span>
        </label>
      </div>

      <button type="submit" class="submit-btn">
        <span>دخول إلى الرئيسية</span>
        <i class="fa-solid fa-arrow-left"></i>
      </button>
    </form>

    <!-- إنشاء حساب -->
    <form id="registerForm" class="form-box" onsubmit="handleAuth(event, 'register')">
      <div class="form-group">
        <label>الاسم الكامل</label>
        <div class="input-wrapper">
          <i class="fa-regular fa-user"></i>
          <input type="text" id="regName" class="form-input" placeholder="محمد أحمد" required>
        </div>
      </div>

      <div class="form-group">
        <label>البريد الإلكتروني</label>
        <div class="input-wrapper">
          <i class="fa-regular fa-envelope"></i>
          <input type="email" id="regEmail" class="form-input" placeholder="name@example.com" required>
        </div>
      </div>

      <div class="form-group">
        <label>كلمة المرور</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="regPassword" class="form-input" placeholder="••••••••" required>
        </div>
      </div>

      <button type="submit" class="submit-btn">
        <span>إنشاء الحساب والدخول</span>
        <i class="fa-solid fa-user-plus"></i>
      </button>
    </form>
  </div>

  <script>
    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.form-box').forEach(f => f.classList.remove('active'));

      if (tab === 'login') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('loginForm').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('registerForm').classList.add('active');
      }
    }

    function handleAuth(event, type) {
      event.preventDefault();

      const SESSION_KEY = "alislamiah_tube_session";

      // حفظ بيانات الجلسة البرمجية
      const sessionData = { loggedIn: true, time: new Date().getTime() };
      localStorage.setItem(SESSION_KEY, JSON.stringify(sessionData));
      sessionStorage.setItem('isLoggedIn', 'true');

      if (type === 'login') {
        const remember = document.getElementById('rememberMe').checked;
        if (remember) {
          localStorage.setItem('alislamiah_remember', 'true');
        } else {
          localStorage.removeItem('alislamiah_remember');
        }
      }

      // التوجيه المباشر والنهائي للصفحة الرئيسية
      window.location.replace("index.html");
    }

    // تعبئة البريد المحفوظ تلقائياً إن وجد
    window.addEventListener('DOMContentLoaded', () => {
      const isRemembered = localStorage.getItem('alislamiah_remember');
      if (isRemembered === 'true') {
        document.getElementById('rememberMe').checked = true;
      }
    });
  </script>
</body>
</html>
