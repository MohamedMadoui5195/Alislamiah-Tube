<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تسجيل الدخول - Alislamiah Tube</title>

<link rel="icon" href="icon.png" type="image/png">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",Tahoma,Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    color:#fff;
    background:
        radial-gradient(circle at 50% -10%,#12345a 0%,#071526 38%,#02070d 100%);
}

.login-card{
    width:100%;
    max-width:430px;
    padding:32px 25px;
    border-radius:26px;
    background:rgba(5,18,32,.97);
    border:1px solid rgba(80,140,200,.25);
    box-shadow:0 25px 70px rgba(0,0,0,.55);
}

.top-bar{
    display:flex;
    justify-content:flex-end;
    margin-bottom:8px;
}

.language{
    appearance:none;
    background:#0a1d30;
    border:1px solid #1d4568;
    color:#c9dced;
    border-radius:10px;
    padding:8px 12px;
    outline:none;
    cursor:pointer;
    font-size:13px;
}

.logo{
    width:88px;
    height:88px;
    object-fit:contain;
    display:block;
    margin:8px auto 18px;
    border-radius:22px;
}

h1{
    text-align:center;
    font-size:27px;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#91a8bd;
    font-size:14px;
    margin-bottom:30px;
}

.field{
    margin-bottom:18px;
}

.field-label{
    display:block;
    margin-bottom:8px;
    color:#dce8f3;
    font-size:14px;
    font-weight:600;
}

.input-wrap{
    position:relative;
}

.input{
    width:100%;
    height:54px;
    padding:0 16px;
    border-radius:15px;
    border:1px solid #183957;
    outline:none;
    background:#071827;
    color:#fff;
    font-size:15px;
}

.input:focus{
    border-color:#2879c7;
    box-shadow:0 0 0 3px rgba(40,121,199,.12);
}

.input::placeholder{
    color:#61788e;
}

.password-input{
    padding-left:70px;
}

.show-password{
    position:absolute;
    left:12px;
    top:50%;
    transform:translateY(-50%);
    border:0;
    background:transparent;
    color:#78a9d0;
    cursor:pointer;
    font-size:13px;
}

.remember{
    display:flex;
    align-items:center;
    gap:9px;
    margin:3px 0 22px;
    color:#b8c9d8;
    font-size:14px;
    cursor:pointer;
}

.remember input{
    width:18px;
    height:18px;
    accent-color:#2174bd;
}

.login-btn,
.signup-btn{
    width:100%;
    height:54px;
    border-radius:15px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
}

.login-btn{
    border:0;
    color:#fff;
    background:linear-gradient(135deg,#1769b2,#0b3b6e);
    box-shadow:0 8px 25px rgba(13,76,135,.2);
}

.signup-btn{
    margin-top:15px;
    border:1px solid #1c4e78;
    color:#b8d8f3;
    background:#081a2b;
}

.login-btn:active,
.signup-btn:active{
    transform:scale(.98);
}

.message{
    display:none;
    margin-top:15px;
    padding:12px;
    border-radius:12px;
    text-align:center;
    color:#ffb4b4;
    background:rgba(190,50,50,.12);
    border:1px solid rgba(220,70,70,.2);
    font-size:13px;
}

.saved-link{
    display:block;
    text-align:center;
    margin-top:18px;
    color:#6fa9d8;
    text-decoration:none;
    font-size:13px;
}

.saved-link:hover{
    color:#9bcaf0;
}

.footer{
    text-align:center;
    color:#4f667b;
    font-size:12px;
    margin-top:22px;
}
</style>
</head>

<body>

<div class="login-card">

    <div class="top-bar">
        <select id="language" class="language" aria-label="Language">
            <option value="ar">العربية</option>
            <option value="en">English</option>
            <option value="fr">Français</option>
        </select>
    </div>

    <img
        src="icon.png"
        class="logo"
        alt="Alislamiah Tube"
    >

    <h1 id="title">Alislamiah Tube</h1>

    <div id="subtitle" class="subtitle">
        تسجيل الدخول إلى حسابك
    </div>


    <form id="loginForm">

        <div class="field">

            <label
                id="identifierLabel"
                class="field-label"
                for="identifier"
            >
                الإيمايل أو الهاتف
            </label>

            <input
                id="identifier"
                class="input"
                type="text"
                autocomplete="username"
                placeholder="الإيمايل أو رقم الهاتف"
                required
            >

        </div>


        <div class="field">

            <label
                id="passwordLabel"
                class="field-label"
                for="password"
            >
                كلمة المرور
            </label>

            <div class="input-wrap">

                <input
                    id="password"
                    class="input password-input"
                    type="password"
                    autocomplete="current-password"
                    placeholder="كلمة المرور"
                    required
                >

                <button
                    id="showPassword"
                    class="show-password"
                    type="button"
                >
                    إظهار
                </button>

            </div>

        </div>


        <label class="remember">

            <input
                type="checkbox"
                id="savePassword"
            >

            <span id="savePasswordText">
                هل تريد حفظ كلمة المرور؟
            </span>

        </label>


        <button
            id="loginButton"
            type="submit"
            class="login-btn"
        >
            تسجيل الدخول
        </button>

    </form>


    <div
        id="message"
        class="message"
    ></div>


    <button
        id="signupButton"
        type="button"
        class="signup-btn"
        onclick="window.location.href='signup.html'"
    >
        إنشاء حساب
    </button>


    <a
        id="savedLink"
        class="saved-link"
        href="saved.passwords.html"
    >
        🔐 كلمات المرور المحفوظة
    </a>


    <div class="footer">
        © Alislamiah Tube
    </div>

</div>


<script>

/* =========================================================
   التخزين
   ========================================================= */

/*
   بيانات الجلسة التشغيلية.
   لا تحتوي على كلمة المرور.
*/
const SESSION_KEY = "alislamiah_tube_session";


/*
   هذا المفتاح متوافق مع صفحة
   saved.passwords.html
*/
const PASSWORDS_KEY = "alislamiah_saved_passwords";


/* =========================================================
   عناصر الصفحة
   ========================================================= */

const language = document.getElementById("language");

const title = document.getElementById("title");
const subtitle = document.getElementById("subtitle");

const identifierLabel =
    document.getElementById("identifierLabel");

const passwordLabel =
    document.getElementById("passwordLabel");

const identifier =
    document.getElementById("identifier");

const password =
    document.getElementById("password");

const showPassword =
    document.getElementById("showPassword");

const savePassword =
    document.getElementById("savePassword");

const savePasswordText =
    document.getElementById("savePasswordText");

const loginButton =
    document.getElementById("loginButton");

const signupButton =
    document.getElementById("signupButton");

const savedLink =
    document.getElementById("savedLink");

const message =
    document.getElementById("message");

const loginForm =
    document.getElementById("loginForm");


/* =========================================================
   اللغات
   ========================================================= */

const translations = {

    ar:{
        direction:"rtl",
        subtitle:"تسجيل الدخول إلى حسابك",
        identifierLabel:"الإيمايل أو الهاتف",
        identifierPlaceholder:"الإيمايل أو رقم الهاتف",
        passwordLabel:"كلمة المرور",
        passwordPlaceholder:"كلمة المرور",
        show:"إظهار",
        hide:"إخفاء",
        savePassword:"هل تريد حفظ كلمة المرور؟",
        login:"تسجيل الدخول",
        signup:"إنشاء حساب",
        saved:"🔐 كلمات المرور المحفوظة",
        error:"يرجى إدخال الإيمايل أو الهاتف وكلمة المرور.",
        copied:""
    },

    en:{
        direction:"ltr",
        subtitle:"Sign in to your account",
        identifierLabel:"Email or phone",
        identifierPlaceholder:"Email or phone number",
        passwordLabel:"Password",
        passwordPlaceholder:"Password",
        show:"Show",
        hide:"Hide",
        savePassword:"Do you want to save your password?",
        login:"Sign in",
        signup:"Create account",
        saved:"🔐 Saved passwords",
        error:"Please enter your email or phone and password.",
        copied:""
    },

    fr:{
        direction:"ltr",
        subtitle:"Connectez-vous à votre compte",
        identifierLabel:"E-mail ou téléphone",
        identifierPlaceholder:"E-mail ou numéro de téléphone",
        passwordLabel:"Mot de passe",
        passwordPlaceholder:"Mot de passe",
        show:"Afficher",
        hide:"Masquer",
        savePassword:"Voulez-vous enregistrer votre mot de passe ?",
        login:"Se connecter",
        signup:"Créer un compte",
        saved:"🔐 Mots de passe enregistrés",
        error:"Veuillez saisir votre e-mail ou numéro de téléphone et votre mot de passe.",
        copied:""
    }

};


/* =========================================================
   تطبيق اللغة
   ========================================================= */

function applyLanguage(lang){

    const t = translations[lang] || translations.ar;

    document.documentElement.lang = lang;
    document.documentElement.dir = t.direction;

    subtitle.textContent = t.subtitle;

    identifierLabel.textContent =
        t.identifierLabel;

    identifier.placeholder =
        t.identifierPlaceholder;

    passwordLabel.textContent =
        t.passwordLabel;

    password.placeholder =
        t.passwordPlaceholder;

    savePasswordText.textContent =
        t.savePassword;

    loginButton.textContent =
        t.login;

    signupButton.textContent =
        t.signup;

    savedLink.textContent =
        t.saved;

    if(password.type === "password"){
        showPassword.textContent = t.show;
    }else{
        showPassword.textContent = t.hide;
    }

    localStorage.setItem(
        "alislamiah_tube_language",
        lang
    );
}


/* اللغة المحفوظة */

const savedLanguage =
    localStorage.getItem("alislamiah_tube_language") || "ar";

language.value = savedLanguage;

applyLanguage(savedLanguage);


language.addEventListener("change",function(){

    applyLanguage(language.value);

});


/* =========================================================
   إظهار كلمة المرور
   ========================================================= */

showPassword.addEventListener("click",function(){

    const t = translations[language.value];

    if(password.type === "password"){

        password.type = "text";
        showPassword.textContent = t.hide;

    }else{

        password.type = "password";
        showPassword.textContent = t.show;

    }

});


/* =========================================================
   قراءة كلمات المرور المحفوظة
   ========================================================= */

function getSavedPasswords(){

    try{

        return JSON.parse(
            localStorage.getItem(PASSWORDS_KEY) || "[]"
        );

    }catch(error){

        return [];

    }

}


/*
   إذا كان هناك حفظ سابق لهذا المستخدم،
   يتم تعبئة الحقول تلقائياً.
*/

const savedPasswords =
    getSavedPasswords();

if(savedPasswords.length > 0){

    const last =
        savedPasswords[0];

    if(last){

        if(last.email){
            identifier.value = last.email;
        }

        if(last.password){

            password.value = last.password;
            savePassword.checked = true;

        }

    }

}


/* =========================================================
   تسجيل الدخول
   ========================================================= */

loginForm.addEventListener("submit",function(event){

    event.preventDefault();

    const user =
        identifier.value.trim();

    const pass =
        password.value;

    const t =
        translations[language.value];


    if(!user || !pass){

        showMessage(t.error);

        return;

    }


    /* =====================================================
       أولاً: بيانات التشغيل
       ===================================================== */

    const session = {

        loggedIn:true,

        identifier:user,

        loginTime:Date.now()

    };

    localStorage.setItem(
        SESSION_KEY,
        JSON.stringify(session)
    );


    /* =====================================================
       ثانياً: حفظ كلمة المرور اختيارياً
       ===================================================== */

    if(savePassword.checked){

        let list =
            getSavedPasswords();


        /*
           البحث عن الحساب نفسه.
           نستخدم البريد/الهاتف + الموقع.
        */

        const existing =
            list.findIndex(item =>
                String(item.email || "").toLowerCase().trim()
                === user.toLowerCase()
                &&
                String(item.site || "Alislamiah Tube")
                === "Alislamiah Tube"
            );


        const entry = {

            id:Date.now(),

            name:"Alislamiah Tube",

            email:user.toLowerCase(),

            password:pass,

            site:"Alislamiah Tube",

            savedAt:new Date().toISOString()

        };


        if(existing >= 0){

            list[existing] = entry;

        }else{

            list.unshift(entry);

        }


        localStorage.setItem(
            PASSWORDS_KEY,
            JSON.stringify(list)
        );

    }else{

        /*
           إذا ألغى المستخدم الخيار،
           نحذف الحفظ السابق لنفس الحساب.
        */

        let list =
            getSavedPasswords();

        list =
            list.filter(item =>
                String(item.email || "").toLowerCase().trim()
                !== user.toLowerCase()
                ||
                String(item.site || "Alislamiah Tube")
                !== "Alislamiah Tube"
            );

        localStorage.setItem(
            PASSWORDS_KEY,
            JSON.stringify(list)
        );

    }


    /* =====================================================
       الانتقال إلى الرئيسية
       ===================================================== */

    window.location.href = "index.html";

});


/* =========================================================
   رسالة
   ========================================================= */

function showMessage(text){

    message.textContent = text;

    message.style.display = "block";

}

</script>

</body>
</html>
