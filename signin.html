<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول - Alislamiah Tube</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Arial,sans-serif}
body{background:#0d0d12;color:#fff;min-height:100vh;display:flex;justify-content:center;align-items:center}

/* خلفية شعاعية حمراء مخصصة لـ Alislamiah Tube */
.bg{position:fixed;inset:0;background:radial-gradient(circle at 15% 20%,rgba(255,0,0,.25),transparent 35%),radial-gradient(circle at 85% 25%,rgba(255,51,51,.15),transparent 30%),#0d0d12;z-index:0}

.container{position:relative;z-index:1;width:92%;max-width:400px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:28px;padding:40px 30px;backdrop-filter:blur(20px);box-shadow:0 25px 50px rgba(0,0,0,.5);text-align:center}

/* شعار Alislamiah Tube باللون الأحمر */
.logo{width:75px;height:75px;margin:0 auto 20px;border-radius:20px;background:linear-gradient(135deg,#ff0000,#cc0000);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;box-shadow:0 8px 25px rgba(255,0,0,.35)}

h1{font-size:24px;margin-bottom:6px}
.subtitle{color:#aaaaaa;font-size:14px;margin-bottom:28px}
.input-group{margin-bottom:16px;text-align:right}
.input-group label{display:block;font-size:13px;color:#bbbbbb;margin-bottom:6px}
.input-group input{width:100%;padding:14px;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.12);border-radius:12px;color:#fff;font-size:15px;outline:none}
.input-group input:focus{border-color:#ff0000}

/* زر الدخول بالهوية الجديدة */
.btn{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,#ff0000,#cc0000);color:#fff;font-size:16px;font-weight:700;cursor:pointer;margin-top:8px}
.message{margin-top:14px;font-size:14px;min-height:20px}
.message.error{color:#ff6b6b}.message.success{color:#4ade80}
.links{margin-top:22px;font-size:14px;color:#aaaaaa}
.links a{color:#ff0000;text-decoration:none;font-weight:600}

/* نافذة حفظ كلمة المرور بتنسيق Alislamiah Tube */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;justify-content:center;align-items:center;z-index:100}
.modal-overlay.show{display:flex}
.modal{background:#16161e;border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:28px;width:90%;max-width:360px;text-align:center}
.modal h3{margin-bottom:10px;font-size:18px}
.modal p{color:#aaaaaa;font-size:14px;margin-bottom:22px;line-height:1.5}
.modal-btns{display:flex;gap:12px}
.modal-btns button{flex:1;padding:12px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer}
.btn-yes{background:linear-gradient(135deg,#ff0000,#cc0000);color:#fff}
.btn-no{background:rgba(255,255,255,.08);color:#ccc}
</style>
</head>
<body>
<div class="bg"></div>

<div class="container">
  <div class="logo">Tube</div>
  <h1>تسجيل الدخول</h1>
  <p class="subtitle">مرحباً بك مجدداً في منصة الإسلامية تيوب</p>

  <div class="input-group">
    <label>البريد الإلكتروني</label>
    <input type="email" id="email" placeholder="example@email.com">
  </div>

  <div class="input-group">
    <label>كلمة المرور</label>
    <input type="password" id="password" placeholder="••••••••">
  </div>

  <button class="btn" onclick="login()">دخول</button>
  <div class="message" id="msg"></div>

  <div class="links">
    ليس لديك حساب؟ <a href="signup.html">إنشاء حساب جديد</a>
  </div>
</div>

<!-- نافذة سؤال حفظ كلمة المرور الأصلية بتصميم Tube الجديد -->
<div class="modal-overlay" id="saveModal">
  <div class="modal">
    <h3>هل تريد حفظ كلمة المرور؟</h3>
    <p>سيتم حفظها في صفحة كلمات المرور المحفوظة الخاصة بمنصة الإسلامية تيوب حتى تتمكن من استرجاعها لاحقاً إذا نسيتها.</p>
    <div class="modal-btns">
      <button class="btn-yes" onclick="saveYes()">نعم، احفظها</button>
      <button class="btn-no" onclick="saveNo()">لا</button>
    </div>
  </div>
</div>

<script>
  let tempData = null;

  function getUsers() {
    return JSON.parse(localStorage.getItem("alislamiah_users") || "[]");
  }

  function getSavedPasswords() {
    return JSON.parse(localStorage.getItem("alislamiah_saved_passwords") || "[]");
  }

  function setCurrentUser(user) {
    localStorage.setItem("alislamiah_current_user", JSON.stringify(user));
  }

  // إذا كان مسجلاً مسبقاً → توجيه مباشر
  if (localStorage.getItem("alislamiah_current_user")) {
    window.location.href = "index.html";
  }

  function login() {
    const email = document.getElementById("email").value.trim().toLowerCase();
    const password = document.getElementById("password").value;
    const msg = document.getElementById("msg");

    msg.textContent = "";
    msg.className = "message";

    if (!email || !password) {
      msg.className = "message error";
      msg.textContent = "يرجى إدخال البريد وكلمة المرور";
      return;
    }

    const users = getUsers();
    const found = users.find(u => u.email === email && u.password === password);

    if (!found) {
      msg.className = "message error";
      msg.textContent = "البريد أو كلمة المرور غير صحيحة";
      return;
    }

    // نجاح الدخول - تخزين البيانات المؤقتة تماماً كما كانت
    tempData = { email: found.email, password: found.password, name: found.name };
    setCurrentUser({ id: found.id, name: found.name, email: found.email });

    // إظهار سؤال الحفظ المنبثق
    document.getElementById("saveModal").classList.add("show");
  }

  function saveYes() {
    if (!tempData) return;

    const saved = getSavedPasswords();
    const exists = saved.find(s => s.email === tempData.email);

    if (!exists) {
      saved.push({
        name: tempData.name,
        email: tempData.email,
        password: tempData.password,
        savedAt: new Date().toISOString()
      });
      localStorage.setItem("alislamiah_saved_passwords", JSON.stringify(saved));
    }

    document.getElementById("saveModal").classList.remove("show");
    window.location.href = "index.html";
  }

  function saveNo() {
    document.getElementById("saveModal").classList.remove("show");
    window.location.href = "index.html";
  }

  // زر Enter لتسهيل الإدخال
  document.getElementById("password").addEventListener("keypress", function(e) {
    if (e.key === "Enter") login();
  });
</script>
</body>
</html>
