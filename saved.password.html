<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كلمات المرور المحفوظة - Alislamiah AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Arial,sans-serif}
body{background:#0b1020;color:#fff;min-height:100vh;padding:20px 15px}
.bg{position:fixed;inset:0;background:radial-gradient(circle at 20% 20%,rgba(0,119,255,.22),transparent 40%),radial-gradient(circle at 80% 70%,rgba(0,195,255,.12),transparent 40%),#0b1020;z-index:0}
.container{position:relative;z-index:1;max-width:620px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;flex-wrap:wrap;gap:12px}
h1{font-size:22px;font-weight:700}
.btn{padding:10px 16px;border:none;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer}
.btn-back{background:rgba(255,255,255,.1);color:#ccc}
.note{background:rgba(0,195,255,.08);border:1px solid rgba(0,195,255,.2);border-radius:14px;padding:13px 16px;margin-bottom:20px;font-size:13.5px;color:#a0d4ff;line-height:1.6}
.card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:18px;margin-bottom:14px}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.card h3{font-size:16px;margin-bottom:4px}
.card .email{font-size:13px;color:#9fb8e0}
.card .site{font-size:12px;color:#6a82a8;margin-top:4px}
.password-row{display:flex;align-items:center;gap:8px;margin-top:12px;background:rgba(0,0,0,.28);padding:10px 12px;border-radius:12px}
.password-row span{flex:1;font-family:monospace;letter-spacing:1px;font-size:14px;word-break:break-all}
.btn-show{background:rgba(0,195,255,.15);color:#00c3ff;border:none;padding:7px 12px;border-radius:8px;cursor:pointer;font-size:13px;white-space:nowrap}
.btn-copy{background:rgba(255,255,255,.08);color:#ccc;border:none;padding:7px 12px;border-radius:8px;cursor:pointer;font-size:13px}
.btn-delete{background:rgba(255,80,80,.15);color:#ff6b6b;border:none;padding:7px 12px;border-radius:8px;cursor:pointer;font-size:13px}
.empty{text-align:center;padding:55px 20px;color:#6a82a8}
.empty-icon{font-size:42px;margin-bottom:12px}
.actions-bottom{text-align:center;margin-top:20px}
.btn-clear{background:rgba(255,80,80,.18);color:#ff6b6b;border:1px solid rgba(255,80,80,.35);padding:11px 20px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<div class="bg"></div>

<div class="container">
  <header>
    <h1>كلمات المرور المحفوظة</h1>
    <button class="btn btn-back" onclick="window.location.href='index.html'">العودة</button>
  </header>

  <div class="note">
    🔒 تظهر هنا كلمات المرور التي تم حفظها تلقائياً عند تسجيل الدخول أو إنشاء الحساب، أو التي تم حفظها من داخل التطبيق.
  </div>

  <div id="list"></div>
</div>

<script>
  // ====================== النظام ======================
  const STORAGE_KEY = "alislamiah_saved_passwords";

  function getSaved() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    } catch {
      return [];
    }
  }

  function setSaved(list) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  }

  // حفظ كلمة مرور (يُستدعى آلياً من صفحات أخرى)
  // الاستخدام من أي صفحة:
  // window.savePasswordAuto({ name, email, password, site })
  window.savePasswordAuto = function (data) {
    if (!data || !data.password) return;

    const list = getSaved();
    const email = (data.email || "").toLowerCase().trim();
    const site = (data.site || "Alislamiah AI").trim();

    // تجنب التكرار لنفس البريد + نفس الموقع
    const existsIndex = list.findIndex(item =>
      item.email === email && item.site === site
    );

    const entry = {
      id: Date.now(),
      name: data.name || "مستخدم",
      email: email,
      password: data.password,
      site: site,
      savedAt: new Date().toISOString()
    };

    if (existsIndex >= 0) {
      list[existsIndex] = entry; // تحديث
    } else {
      list.unshift(entry); // إضافة في الأعلى
    }

    setSaved(list);
  };

  // ====================== العرض ======================
  function render() {
    const list = getSaved();
    const box = document.getElementById("list");

    if (list.length === 0) {
      box.innerHTML = `
        <div class="empty">
          <div class="empty-icon">🔐</div>
          <p>لا توجد كلمات مرور محفوظة بعد</p>
          <p style="font-size:13px;margin-top:8px;opacity:.8">
            عند تسجيل الدخول أو إنشاء حساب اختر "نعم، احفظها"
          </p>
        </div>`;
      return;
    }

    box.innerHTML = list.map((item, index) => `
      <div class="card">
        <div class="card-header">
          <div>
            <h3>${escapeHtml(item.name || "مستخدم")}</h3>
            <div class="email">${escapeHtml(item.email || "")}</div>
            <div class="site">🌐 ${escapeHtml(item.site || "Alislamiah AI")}</div>
          </div>
        </div>
        <div class="password-row">
          <span id="pass-${index}">••••••••</span>
          <button class="btn-show" onclick="togglePass(${index})">إظهار</button>
          <button class="btn-copy" onclick="copyPass(${index})">نسخ</button>
          <button class="btn-delete" onclick="deletePass(${index})">حذف</button>
        </div>
      </div>
    `).join("") + `
      <div class="actions-bottom">
        <button class="btn-clear" onclick="clearAll()">مسح الكل</button>
      </div>`;
  }

  function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }

  function togglePass(index) {
    const list = getSaved();
    const el = document.getElementById("pass-" + index);
    const btn = el.nextElementSibling;
    if (!list[index]) return;

    if (el.textContent === "••••••••") {
      el.textContent = list[index].password;
      btn.textContent = "إخفاء";
    } else {
      el.textContent = "••••••••";
      btn.textContent = "إظهار";
    }
  }

  function copyPass(index) {
    const list = getSaved();
    if (!list[index]) return;
    navigator.clipboard.writeText(list[index].password).then(() => {
      alert("تم نسخ كلمة المرور");
    }).catch(() => {
      alert("تعذر النسخ");
    });
  }

  function deletePass(index) {
    if (!confirm("هل تريد حذف كلمة المرور هذه؟")) return;
    const list = getSaved();
    list.splice(index, 1);
    setSaved(list);
    render();
  }

  function clearAll() {
    if (!confirm("هل أنت متأكد من مسح جميع كلمات المرور؟")) return;
    localStorage.removeItem(STORAGE_KEY);
    render();
  }

  render();
</script>
</body>
</html>
