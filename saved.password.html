<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Alislamiah Tube - كلمات المرور المحفوظة</title>

<link rel="icon" href="icon.png">

<style>

*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
background:
radial-gradient(circle at top,#0d3264,#041225 48%,#020812);
color:#fff;
font-family:Arial,sans-serif;
padding:20px;
}

.box{
width:100%;
max-width:520px;
margin:25px auto;
background:rgba(5,19,40,.95);
border:1px solid #1b4778;
border-radius:27px;
padding:28px 22px;
box-shadow:0 25px 70px #0009;
}

.logo{text-align:center}

.logo img{
width:78px;
height:78px;
border-radius:20px;
}

.h{text-align:center}

.h h1{
font-size:24px;
margin:14px 0 7px;
}

.h p{
color:#9db4d1;
font-size:14px;
margin-bottom:25px;
}

.record{
background:#091d38;
border:1px solid #21466f;
border-radius:17px;
padding:18px;
margin-bottom:12px;
}

.row{
display:flex;
justify-content:space-between;
gap:12px;
padding:9px 0;
border-bottom:1px solid #183653;
}

.row:last-child{
border-bottom:0;
}

.label{
color:#91aac8;
font-size:13px;
}

.value{
font-size:14px;
word-break:break-all;
}

.pass{
filter:blur(5px);
cursor:pointer;
user-select:none;
}

.pass.show{
filter:none;
}

.actions{
display:flex;
gap:9px;
margin-top:20px;
}

.btn{
flex:1;
height:47px;
border-radius:13px;
cursor:pointer;
font-weight:bold;
}

.back{
background:#1769df;
border:0;
color:#fff;
}

.logout{
background:#0a203c;
color:#dbe8f7;
border:1px solid #2b5277;
}

.empty{
text-align:center;
color:#9db4d1;
padding:25px 5px;
}

.note{
text-align:center;
color:#728ba8;
font-size:12px;
line-height:1.7;
margin-top:20px;
}

.langs{
display:flex;
justify-content:center;
gap:7px;
margin-top:20px;
}

.langs button{
background:#071a34;
color:#a5bad3;
border:1px solid #20446d;
border-radius:9px;
padding:7px 10px;
cursor:pointer;
}

.langs .active{
background:#125dc9;
color:#fff;
border-color:#318aff;
}

</style>

</head>

<body>

<div class="box">

<div class="logo">
<img src="icon.png" alt="Alislamiah Tube">
</div>

<div class="h">

<h1 id="title">
كلمات المرور المحفوظة
</h1>

<p id="sub">
بيانات الحساب المحفوظة على هذا الجهاز
</p>

</div>

<div id="content"></div>

<div class="actions">

<button class="btn back" id="back">
العودة للرئيسية
</button>

<button class="btn logout" id="logout">
تسجيل الخروج
</button>

</div>

<div class="note" id="note">
هذه الصفحة تعرض بيانات المستخدم المسجّل دخوله فقط على هذا الجهاز.
</div>

<div class="langs">

<button data-l="ar">العربية</button>
<button data-l="fr">Français</button>
<button data-l="en">English</button>

</div>

</div>

<script>

const SESSION_KEY=
"alislamiah_tube_session";

const SAVED_KEY=
"alislamiah_tube_saved_passwords";

const LANG_KEY=
"alislamiah_tube_lang";


const T={

ar:{
title:"كلمات المرور المحفوظة",
sub:"بيانات الحساب المحفوظة على هذا الجهاز",
email:"البريد الإلكتروني",
phone:"رقم الهاتف",
pass:"كلمة المرور",
empty:"لا توجد كلمة مرور محفوظة لهذا الحساب.",
show:"اضغط لإظهار كلمة المرور",
back:"العودة للرئيسية",
logout:"تسجيل الخروج",
note:"هذه الصفحة تعرض بيانات المستخدم المسجّل دخوله فقط على هذا الجهاز.",
need:"يجب تسجيل الدخول أولًا."
},

fr:{
title:"Mots de passe enregistrés",
sub:"Données du compte enregistrées sur cet appareil",
email:"E-mail",
phone:"Numéro de téléphone",
pass:"Mot de passe",
empty:"Aucun mot de passe enregistré pour ce compte.",
show:"Touchez pour afficher le mot de passe",
back:"Retour à l'accueil",
logout:"Se déconnecter",
note:"Cette page affiche uniquement les données de l'utilisateur connecté sur cet appareil.",
need:"Veuillez vous connecter d'abord."
},

en:{
title:"Saved passwords",
sub:"Account data saved on this device",
email:"Email",
phone:"Phone number",
pass:"Password",
empty:"No password is saved for this account.",
show:"Tap to reveal the password",
back:"Back to home",
logout:"Sign out",
note:"This page shows only the currently signed-in user's data on this device.",
need:"Please sign in first."
}

};


let lang=
localStorage.getItem(LANG_KEY)||"ar";


function getSession(){

try{

return JSON.parse(
localStorage.getItem(SESSION_KEY)||"null"
);

}catch{

return null;

}

}


function escapeHtml(value){

return String(value).replace(
/[&<>"']/g,
m=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[m])

);

}


function render(){

const t=T[lang];

const session=getSession();

const content=
document.getElementById("content");


if(!session){

content.innerHTML=
'<div class="empty">'+
t.need+
'</div>';

setTimeout(()=>{

location.href="signin.html";

},700);

return;

}


let list=[];

try{

list=
JSON.parse(
localStorage.getItem(SAVED_KEY)||"[]"
);

}catch{

list=[];

}


const record=
list.find(
item=>item.userId===session.id
);


if(!record){

content.innerHTML=
'<div class="empty">'+
t.empty+
'</div>';

return;

}


content.innerHTML=`

<div class="record">

<div class="row">

<span class="label">
${t.email}
</span>

<span class="value">
${escapeHtml(record.email||"—")}
</span>

</div>


<div class="row">

<span class="label">
${t.phone}
</span>

<span class="value">
${escapeHtml(record.phone||"—")}
</span>

</div>


<div class="row">

<span class="label">
${t.pass}
</span>

<span
class="value pass"
id="passwordValue"
title="${t.show}"
>
${escapeHtml(record.password)}
</span>

</div>

</div>

`;


document
.getElementById("passwordValue")
.onclick=function(){

this.classList.toggle("show");

};

}


function applyLanguage(){

const t=T[lang];

document.documentElement.lang=lang;

document.documentElement.dir=
lang==="ar"?"rtl":"ltr";

document.getElementById("title").textContent=t.title;

document.getElementById("sub").textContent=t.sub;

document.getElementById("back").textContent=t.back;

document.getElementById("logout").textContent=t.logout;

document.getElementById("note").textContent=t.note;

document.querySelectorAll(".langs button")
.forEach(button=>{

button.classList.toggle(
"active",
button.dataset.l===lang
);

});

render();

}


document.querySelectorAll(".langs button")
.forEach(button=>{

button.onclick=()=>{

lang=button.dataset.l;

localStorage.setItem(
LANG_KEY,
lang
);

applyLanguage();

};

});


document.getElementById("back").onclick=()=>{

location.href="index.html";

};


document.getElementById("logout").onclick=()=>{

localStorage.removeItem(SESSION_KEY);

location.href="signin.html";

};


applyLanguage();

</script>

</body>

</html>
