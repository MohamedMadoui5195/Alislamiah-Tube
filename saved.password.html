<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كلمات المرور المحفوظة - Alislamiah Tube</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Arial,sans-serif}
body{background:#0d0d12;color:#fff;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:40px 20px}

/* الخلفية الشعاعية الحمراء المتناسقة */
.bg{position:fixed;inset:0;background:radial-gradient(circle at 15% 20%,rgba(255,0,0,.15),transparent 35%),radial-gradient(circle at 85% 25%,rgba(255,51,51,.1),transparent 30%),#0d0d12;z-index:0}

.container{position:relative;z-index:1;width:100%;max-width:800px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:30px;backdrop-filter:blur(20px);box-shadow:0 25px 50px rgba(0,0,0,.5)}

.header-area{display:flex;justify-content:between;align-items:center;margin-bottom:25px;border-bottom:1px solid rgba(255,255,255,.1);padding-bottom:15px}
.title-group h1{font-size:22px;margin-bottom:4px}
.title-group p{color:#aaaaaa;font-size:13px}

.back-btn{padding:10px 18px;border:1px solid rgba(255,255,255,.15);border-radius:10px;background:rgba(255,255,255,.05);color:#fff;font-size:14px;cursor:pointer;text-decoration:none;transition:background .2s}
.back-btn:hover{background:rgba(255,255,255,.12)}

/* جدول عرض البيانات */
.table-wrapper{width:100%;overflow-x:auto}
table{width:100%;border-collapse:collapse;text-align:right;font-size:15px}
th{background:rgba(255,255,255,.03);color:#bbbbbb;font-weight:600;padding:14px;border-bottom:2px solid rgba(255,255,255,.1)}
td{padding:14px;border-bottom:1px solid rgba(255,255,255,.06);color:#fff}

.pass-field{font-family:monospace;font-size:16px;letter-spacing:1px;background:rgba(255,255,255,.05);padding:4px 8px;border-radius:6px;cursor:pointer;user-select:none}
.pass-field:hover{background:rgba(255,255,255,.1)}

.delete-btn{padding:6px 12px;background:rgba(255,107,107,.15);color:#ff6b6b;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;transition:background .2s}
.delete-btn:hover{background:rgba(255,107,107,.3)}

.no-data{text-align:center;padding:40px;color:#aaaaaa;font-size:15px}
</style>
</head>
<body>
<div class="bg"></div>

<div class="container">
  <div class="header-area" style="display:flex; justify-content:space-between; align-items:center;">
    <div class="title-group">
      <h1>إدارة كلمات المرور المحفوظة</h1>
      <p>تجد هنا الحسابات التي وافقت على حفظ بياناتها محلياً في المتصفح</p>
    </div>
    <a href="index.html" class="back-btn">العودة للرئيسية</a>
  </div>

  <div class="table-wrapper">
    <table id="passwordsTable">
      <thead>
        <tr>
          <th>الاسم</th>
          <th>البريد الإلكتروني</th>
          <th>كلمة المرور (اضغط للعرض)</th>
          <th>تاريخ الحفظ</th>
          <th>إجراءات</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <!-- يتم توليد الأسطر برمجياً هنا -->
      </tbody>
    </table>
  </div>
  
  <div id="emptyMessage" class="no-data" style="display:none;">
    لا توجد كلمات مرور محفوظة حالياً.
  </div>
</div>

<script>
  function getSavedPasswords() {
    return JSON.parse(localStorage.getItem("alislamiah_saved_passwords") || "[]");
  }

  function renderTable() {
    const saved = getSavedPasswords();
    const tbody = document.getElementById("tableBody");
    const emptyMsg = document.getElementById("emptyMessage");
    const table = document.getElementById("passwordsTable");

    tbody.innerHTML = "";

    if (saved.length === 0) {
      table.style.display = "none";
      emptyMsg.style.display = "block";
      return;
    }

    table.style.display = "table";
    emptyMsg.style.display = "none";

    saved.forEach((item, index) => {
      const row = document.createElement("tr");

      // تنسيق تاريخ الحفظ بشكل مبسط
      const dateOption = { year: 'numeric', month: 'short', day: 'numeric' };
      const formattedDate = new Date(item.savedAt).toLocaleDateString('ar-EG', dateOption);

      row.innerHTML = `
        <td>${escapeHtml(item.name || 'مجهول')}</td>
        <td>${escapeHtml(item.email)}</td>
        <td>
          <span class="pass-field" data-raw="${escapeHtml(item.password)}" data-hidden="true" onclick="togglePassword(this)">••••••••</span>
        </td>
        <td style="color:#888; font-size:13px;">${formattedDate}</td>
        <td>
          <button class="delete-btn" onclick="deleteRecord(${index})">حذف</button>
        </td>
      `;
      tbody.appendChild(row);
    });
  }

  // دالة إظهار وإخفاء كلمات المرور عند النقر
  function togglePassword(element) {
    const isHidden = element.getAttribute("data-hidden") === "true";
    const rawPassword = element.getAttribute("data-raw");

    if (isHidden) {
      element.textContent = rawPassword;
      element.setAttribute("data-hidden", "false");
      element.style.fontFamily = "inherit"; 
    } else {
      element.textContent = "••••••••";
      element.setAttribute("data-hidden", "true");
      element.style.fontFamily = "monospace";
    }
  }

  // دالة حذف حساب محفوظ من القائمة والـ localStorage
  function deleteRecord(index) {
    if (confirm("هل أنت متأكد من رغبتك في حذف كلمة المرور المحفوظة لهذا الحساب؟")) {
      const saved = getSavedPasswords();
      saved.splice(index, 1);
      localStorage.setItem("alislamiah_saved_passwords", JSON.stringify(saved));
      renderTable();
    }
  }

  // دالة حماية أمنية لمنع حقن كود خبيث عبر الحقول النصية (XSS Prevention)
  function escapeHtml(text) {
    const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
    return text.replace(/[&<>"']/g, function(m) { return map[m]; });
  }

  // تشغيل التهيئة عند تحميل الصفحة
  window.onload = renderTable;
</script>
</body>
</html>
