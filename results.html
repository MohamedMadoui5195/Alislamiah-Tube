<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نتائج البحث - Alislamiah-Tube</title>
  <!-- 1. تم تصحيح مسار أيقونة التبويب لتستدعى من المستودع مباشرة ✅ -->
  <link rel="icon" href="icon.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Cairo',sans-serif;background:#0f0f0f;color:#fff;min-height:100vh;padding-bottom:80px}
    .header{background:#1a1a1a;padding:12px 20px;position:sticky;top:0;z-index:100;border-bottom:1px solid #333;display:flex;align-items:center;gap:12px}
    .app-icon{width:42px;height:42px;border-radius:10px;object-fit:cover}
    .header h1{font-size:1.4rem;font-weight:700;color:#4ade80}
    .main-content{padding:20px;max-width:1200px;margin:0 auto}
    .section-title{font-size:1.2rem;margin-bottom:20px;color:#e5e5e5}
    .videos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
    .video-card{background:#1a1a1a;border-radius:12px;overflow:hidden;text-decoration:none;color:#fff;display:block}
    .video-thumbnail{width:100%;aspect-ratio:16/9;background:#000}
    .video-thumbnail video{width:100%;height:100%;object-fit:cover;pointer-events:none}
    .video-info{padding:14px}
    .video-title{font-size:1rem;font-weight:600;line-height:1.4;margin-bottom:6px}
    .video-meta{font-size:0.85rem;color:#888}
    .no-results{text-align:center;padding:80px 20px;color:#888;font-size:1.15rem}
    .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#1a1a1a;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #333;z-index:100}
    .nav-item{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:#888;font-size:0.8rem;gap:4px}
    .nav-item.active{color:#4ade80}
    .nav-item .icon{font-size:1.4rem}
  </style>
</head>
<body>
  <header class="header">
    <!-- 2. تم تصحيح مسار الأيقونة في الهيدر لتعمل في صفحة البحث ✅ -->
    <img src="icon.png" class="app-icon" alt="Alislamiah-Tube">
    <h1>نتائج البحث</h1>
  </header>

  <main class="main-content">
    <h2 class="section-title" id="resultsTitle">نتائج البحث</h2>
    <div class="videos-grid" id="resultsContainer"></div>
  </main>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item"><span class="icon">🏠</span><span>الرئيسية</span></a>
    <a href="search.html" class="nav-item active"><span class="icon">🔍</span><span>البحث</span></a>
    <a href="https://gemini.google.com" target="_blank" class="nav-item"><span class="icon">✨</span><span>Gemini</span></a>
  </nav>

  <script>
    // 3. تحديث مسارات ملفات الفيديوهات لتطابق الريبو الفعلي (حذف المجلدات الوهمية) ✅
    const videos = [
      {id:1, file:"IMG_20260814_164242_861.mp4", title:"ما تيسر من سورة إبراهيم"},
      {id:2, file:"lv_0_20260824111719.mp4", title:"آيات من سورة مريم بصوت مشاري راشد العفاسي"},
{id:3, file:"IMG_20260812_142700_033.mp4", title:"بل الساعة موعدهم والساعة أدهى وأمر تلاوة عطرة بصوت الشيخ مشاري العفاسي"}


    ];

    const params = new URLSearchParams(window.location.search);
    const query = (params.get('q') || '').trim().toLowerCase();

    const container = document.getElementById('resultsContainer');
    const titleEl = document.getElementById('resultsTitle');

    if (query === '') {
      titleEl.textContent = 'نتائج البحث';
      container.innerHTML = '<div class="no-results">اكتب كلمة بحث أولاً من صفحة البحث</div>';
    } else {
      titleEl.textContent = 'نتائج البحث عن: "' + query + '"';

      const keywords = query.split(/\s+/).filter(k => k.length > 0);

      const filtered = videos.filter(function(v) {
        const title = v.title.toLowerCase();
        return keywords.every(function(kw) {
          return title.includes(kw);
        });
      });

      if (filtered.length === 0) {
        container.innerHTML = '<div class="no-results">لا توجد نتائج</div>';
      } else {
        let html = '';
        filtered.forEach(function(v) {
          // 4. تعديل الرابط الديناميكي المنشأ برمجياً ليمرر اسم ملف الفيديو والعنوان إلى صفحة watch.html بشكل صحيح ✅
          html += '<a href="watch.html?v=' + v.file + '&title=' + encodeURIComponent(v.title) + '" class="video-card">' +
                    '<div class="video-thumbnail">' +
                      '<video preload="metadata" muted autoplay loop playsinline>' +
                        '<source src="' + v.file + '" type="video/mp4">' +
                      '</video>' +
                    '</div>' +
                    '<div class="video-info">' +
                      '<div class="video-title">' + v.title + '</div>' +
                      '<div class="video-meta">Alislamiah-Tube</div>' +
                    '</div>' +
                  '</a>';
        });
        container.innerHTML = html;
      }
    }
  </script>
</body>
</html>
