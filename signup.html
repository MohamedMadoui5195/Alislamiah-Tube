<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب جديد | Alislamiah AI</title>
    <!-- استيراد خط القاهرة الاحترافي -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at top right, #1a2a6c, #1f4e3d, #0f2027);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* جزيئات الخلفية المتحركة */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            display: block;
            background: rgba(40, 167, 69, 0.15);
            border-radius: 50%;
            animation: floatUp 12s linear infinite;
            bottom: -20px;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            10% { opacity: 0.5; }
            90% { opacity: 0.5; }
            100% { transform: translateY(-105vh) scale(0.3); opacity: 0; }
        }

        /* كارت إنشاء الحساب الاحترافي */
        .signup-card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 35px 35px;
            border-radius: 28px;
            box-shadow: 0 25px 55px rgba(0, 0, 0, 0.4);
            text-align: center;
            max-width: 400px;
            width: 90%;
            z-index: 10;
            transition: transform 0.3s ease;
        }

        /* تنسيق الأيقونة في الأعلى */
        .top-icon {
            width: 70px;
            height: 70px;
            object-fit: contain;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 10px rgba(40, 167, 69, 0.5));
        }

        .logo-area {
            font-size: 28px;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 5px;
        }

        .logo-area span {
            color: #28a745;
            text-shadow: 0 0 20px rgba(40, 167, 69, 0.5);
        }

        .subtitle {
            color: #a2b9cc;
            font-size: 13px;
            margin-bottom: 25px;
        }

        /* مجموعة الإدخال */
        .input-group {
            margin-bottom: 15px;
            text-align: right;
        }

        .input-group input {
            width: 100%;
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input::placeholder {
            color: #b0c4de;
            opacity: 0.7;
        }

        .input-group input:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: #28a745;
            box-shadow: 0 0 12px rgba(40, 167, 69, 0.3);
        }

        /* زر التسجيل الاحترافي */
        .btn-signup {
            background: linear-gradient(135deg, #28a745, #19692c);
            color: #ffffff;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 6px 20px rgba(40, 167, 69, 0.3);
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-signup:hover {
            background: linear-gradient(135deg, #218838, #145323);
            box-shadow: 0 10px 25px rgba(40, 167, 69, 0.5);
            transform: scale(1.01);
        }

        /* رابط العودة لتسجيل الدخول */
        .login-link {
            display: inline-block;
            margin-top: 20px;
            color: #b0c4de;
            font-size: 14px;
            text-decoration: none;
            transition: color 0.2s;
        }

        .login-link span {
            color: #28a745;
            font-weight: 700;
        }

        .login-link:hover span {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<!-- خلفية الجزيئات الطائرة -->
<div class="particles" id="particleContainer"></div>

<div class="signup-card">
    <!-- الأيقونة المطلوبة في الأعلى تماماً -->
    <img src="icon.png" alt="Logo" class="top-icon">
    
    <div class="logo-area">Alislamiah <span>AI</span></div>
    <div class="subtitle">إنشاء حساب جديد للاستفادة من كافة الخدمات</div>
    
    <!-- نموذج إنشاء الحساب العادي -->
    <form id="signupForm">
        <div class="input-group">
            <input type="text" id="username" placeholder="اسم المستخدم" required>
        </div>
        <div class="input-group">
            <input type="email" id="email" placeholder="البريد الإلكتروني" required>
        </div>
        <div class="input-group">
            <input type="password" id="password" placeholder="كلمة المرور" required>
        </div>
        <button type="submit" class="btn-signup">تسجيل وتفعيل الحساب</button>
    </form>

    <!-- رابط العودة إلى صفحة تسجيل الدخول القديمة -->
    <a href="signin.html" class="login-link">لديك حساب بالفعل؟ <span>تسجيل الدخول</span></a>
</div>

<script>
// توليد الجزيئات ديناميكياً لجمالية الخلفية
window.addEventListener('DOMContentLoaded', function() {
    const container = document.getElementById('particleContainer');
    const particleCount = 15;
    for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('span');
        particle.classList.add('particle');
        const size = Math.random() * 6 + 4;
        particle.style.width = size + 'px';
        particle.style.height = size + 'px';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.animationDelay = Math.random() * 8 + 's';
        particle.style.animationDuration = Math.random() * 10 + 6 + 's';
        container.appendChild(particle);
    }
});

// معالجة نموذج الإرسال
document.getElementById('signupForm').addEventListener('submit', function(event) {
    event.preventDefault();
    alert('سيتم ربط عملية إنشاء الحساب بقاعدة بياناتك هنا لاحقاً.');
});
</script>

</body>
</html>
