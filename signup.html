<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنشاء حساب - Alislamiah Tube</title>
<link rel="icon" href="icon.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Arial,sans-serif}
body{background:#07111f;color:#fff;min-height:100vh;display:flex;justify-content:center;align-items:center;position:relative;padding:20px 0}
.bg{position:fixed;inset:0;background:
  radial-gradient(circle at 15% 20%,rgba(111,183,255,.22),transparent 38%),
  radial-gradient(circle at 85% 30%,rgba(8,120,255,.18),transparent 35%),
  #07111f;z-index:0}
.container{position:relative;z-index:1;width:92%;max-width:400px;background:rgba(11,26,44,.9);border:1px solid #173553;border-radius:24px;padding:36px 28px 30px;box-shadow:0 25px 50px rgba(0,0,0,.45);text-align:center}
.logo{width:72px;height:72px;margin:0 auto 18px;border-radius:18px;overflow:hidden;background:linear-gradient(135deg,#087fff,#6fb7ff);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 28px rgba(8,127,255,.4)}
.logo img{width:100%;height:100%;object-fit:cover}
h1{font-size:22px;font-weight:700;margin-bottom:6px}
.subtitle{color:#718ba6;font-size:14px;margin-bottom:20px}
.input-group{margin-bottom:12px;text-align:right}
.input-group label{display:block;font-size:13px;color:#8aa4c0;margin-bottom:6px}
.input-group input{width:100%;padding:13px 15px;background:rgba(255,255,255,.06);border:1.5px solid #1e3a55;border-radius:12px;color:#fff;font-size:15px;outline:none}
.input-group input:focus{border-color:#6fb7ff;box-shadow:0 0 0 3px rgba(111,183,255,.15)}
.btn{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,#087fff,#3d9cff);color:#fff;font-size:16px;font-weight:700;cursor:pointer;margin-top:6px}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0 16px;color:#5a7390;font-size:13px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#1e3a55}

/* زر Alislamiah AI */
.btn-ai{
  width:100%;
  padding:14px;
  border:1.5px solid rgba(111,183,255,.5);
  border-radius:12px;
  background:rgba(111,183,255,.1);
  color:#6fb7ff;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  transition:.25s;
}
.btn-ai:hover{background:rgba(111,183,255,.18);border-color:#6fb7ff}
.btn-ai .badge{
  background:linear-gradient(135deg,#087fff,#00c3ff);
  color:#fff;
  font-size:11px;
  font-weight:800;
  padding:4px 9px;
  border-radius:7px;
}

.message{margin-top:14px;font-size:14px;min-height:22px}
.message.error{color:#ff6b6b}
.message.success{color:#4ade80}
.links{margin-top:20px;font-size:14px;color:#718ba6}
.links a{color:#6fb7ff;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<div class="bg"></div>

<div class="container">
  <div class="logo">
    <img src="icon.png" alt="Tube" onerror="this.parentElement.innerHTML='▶️'">
  </div>
  <h1>إنشاء حساب جديد</h1>
  <p class="subtitle">انضم إلى Alislamiah Tube</p>

  <div class="input-group">
    <label>الاسم الكامل</label>
    <input type="text" id="fullname" placeholder="الاسم الشخصي">
  </div>
  <div class="input-group">
    <label>البريد الإلكتروني</label>
    <input type="email" id="email" placeholder="example@email.com">
  </div>
  <div class="input-group">
    <label>كلمة المرور</label>
    <input type="password" id="password" placeholder="••••••••">
  </div>

  <button class="btn" onclick="signup()">إنشاء الحساب</button>
  <div class="message" id="msg"></div>

  <div class="divider">أو</div>

  <button type="button" class="btn-ai" onclick="signupWithAI()">
    <span class="badge">AI</span>
    التسجيل بواسطة Alislamiah AI
  </button>

  <div class="links">
    لديك حساب بالفعل؟ <a href="signin.html">تسجيل الدخول</a>
  </div>
</div>

<script>
  const USERS_KEY = "alislamiah_users";
  const CURRENT_KEY = "alislamiah_current_user";
  const AI_SIGNIN_PAGE = "signin-ai.html";

  function getUsers() {
    try { return JSON.parse(localStorage.getItem(USERS_KEY) || "[]"); }
    catch { return []; }
  }

  function getCurrentUser() {
    try { return JSON.parse(localStorage.getItem(CURRENT_KEY) || "null"); }
    catch { return null; }
  }

  function setCurrentUser(user) {
    localStorage.setItem(CURRENT_KEY, JSON.stringify(user));
  }

  // التوجيه المباشر للرئيسية إذا كان مسجلاً
  if (getCurrentUser()) {
    window.location.href = "index.html";
  }

  // ========== إنشاء حساب جديد ==========
  function signup() {
    const fullname = document.getElementById("fullname").value.trim();
    const email = document.getElementById("email").value.trim().toLowerCase();
    const password = document.getElementById("password").value;
    const msg = document.getElementById("msg");

    msg.className = "message";
    msg.textContent = "";

    if (!fullname || !email || !password) {
      msg.className = "message error";
      msg.textContent = "يرجى ملء جميع الحقول المطلوبة";
      return;
    }

    if (password.length < 6) {
      msg.className = "message error";
      msg.textContent = "كلمة المرور يجب أن تكون 6 أحرف على الأقل";
      return;
    }

    const users = getUsers();
    if (users.some(u => u.email === email)) {
      msg.className = "message error";
      msg.textContent = "هذا البريد الإلكتروني مستخدم بالفعل";
      return;
    }

    const newUser = {
      id: Date.now().toString(),
      name: fullname,
      email: email,
      password: password,
      createdAt: new Date().toISOString()
    };

    users.push(newUser);
    localStorage.setItem(USERS_KEY, JSON.stringify(users));

    // تسجيل الدخول والتحويل الفوري للرئيسية
    setCurrentUser({ id: newUser.id, name: newUser.name, email: newUser.email });

    msg.className = "message success";
    msg.textContent = "تم إنشاء الحساب بنجاح! جارٍ التحويل...";

    setTimeout(function () {
      window.location.href = "index.html";
    }, 600);
  }

  // ========== التسجيل بواسطة AI ==========
  function signupWithAI() {
    const msg = document.getElementById("msg");
    msg.className = "message";
    msg.textContent = "";

    const user = getCurrentUser();
    if (user && user.email) {
      msg.className = "message success";
      msg.textContent = "تم التعرف على حساب Alislamiah AI...";
      setTimeout(function () {
        window.location.href = "index.html";
      }, 600);
      return;
    }

    msg.className = "message error";
    msg.textContent = "جارٍ التحويل إلى صفحة Alislamiah AI...";
    setTimeout(function () {
      window.location.href = AI_SIGNIN_PAGE;
    }, 800);
  }

  document.getElementById("password").addEventListener("keypress", function (e) {
    if (e.key === "Enter") signup();
  });
</script>
</body>
</html>
