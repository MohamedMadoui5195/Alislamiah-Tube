<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إنشاء حساب - Alislamiah Tube</title>

<link rel="icon" href="icon.png" type="image/png">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",Tahoma,Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    color:#fff;
    background:
        radial-gradient(circle at 50% -10%,#12345a 0%,#071526 38%,#02070d 100%);
}

.card{
    width:100%;
    max-width:430px;
    padding:32px 25px;
    border-radius:26px;
    background:rgba(5,18,32,.97);
    border:1px solid rgba(80,140,200,.25);
    box-shadow:0 25px 70px rgba(0,0,0,.55);
}

.top{
    display:flex;
    justify-content:flex-end;
    margin-bottom:8px;
}

.language{
    background:#0a1d30;
    border:1px solid #1d4568;
    color:#c9dced;
    border-radius:10px;
    padding:8px 12px;
    outline:none;
    cursor:pointer;
    font-size:13px;
}

.logo{
    width:88px;
    height:88px;
    object-fit:contain;
    display:block;
    margin:8px auto 18px;
    border-radius:22px;
}

h1{
    text-align:center;
    font-size:27px;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#91a8bd;
    font-size:14px;
    margin-bottom:30px;
}

.field{
    margin-bottom:17px;
}

label{
    display:block;
    margin-bottom:8px;
    color:#dce8f3;
    font-size:14px;
    font-weight:600;
}

.input-wrap{
    position:relative;
}

.input{
    width:100%;
    height:54px;
    padding:0 16px;
    border-radius:15px;
    border:1px solid #183957;
    outline:none;
    background:#071827;
    color:#fff;
    font-size:15px;
}

.input:focus{
    border-color:#2879c7;
    box-shadow:0 0 0 3px rgba(40,121,199,.12);
}

.input::placeholder{
    color:#61788e;
}

.password{
    padding-left:70px;
}

.show{
    position:absolute;
    left:12px;
    top:50%;
    transform:translateY(-50%);
    border:0;
    background:transparent;
    color:#78a9d0;
    cursor:pointer;
    font-size:13px;
}

.signup-btn{
    width:100%;
    height:54px;
    border:0;
    border-radius:15px;
    color:white;
    background:linear-gradient(135deg,#1769b2,#0b3b6e);
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 8px 25px rgba(13,76,135,.2);
}

.signup-btn:active{
    transform:scale(.98);
}

.back{
    width:100%;
    height:52px;
    margin-top:15px;
    border:1px solid #1c4e78;
    border-radius:15px;
    color:#b8d8f3;
    background:#081a2b;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.message{
    display:none;
    margin-top:15px;
    padding:12px;
    border-radius:12px;
    text-align:center;
    font-size:13px;
    line-height:1.6;
}

.error{
    color:#ffb4b4;
    background:rgba(190,50,50,.12);
    border:1px solid rgba(220,70,70,.2);
}

.success{
    color:#9ff0c0;
    background:rgba(40,190,100,.10);
    border:1px solid rgba(40,190,100,.2);
}

.footer{
    text-align:center;
    color:#4f667b;
    font-size:12px;
    margin-top:22px;
}
</style>
</head>

<body>

<div class="card">

    <div class="top">
        <select id="language" class="language">
            <option value="ar">العربية</option>
            <option value="en">English</option>
            <option value="fr">Français</option>
        </select>
    </div>

    <img
        src="icon.png"
        class="logo"
        alt="Alislamiah Tube"
    >

    <h1 id="title">Alislamiah Tube</h1>

    <div id="subtitle" class="subtitle">
        إنشاء حساب جديد
    </div>


    <form id="signupForm">

        <!-- الاسم -->

        <div class="field">

            <label id="nameLabel" for="name">
                الاسم
            </label>

            <input
                id="name"
                class="input"
                type="text"
                autocomplete="name"
                placeholder="أدخل اسمك"
                required
            >

        </div>


        <!-- الإيمايل أو الهاتف -->

        <div class="field">

            <label id="identifierLabel" for="identifier">
                الإيمايل أو الهاتف
            </label>

            <input
                id="identifier"
                class="input"
                type="text"
                autocomplete="username"
                placeholder="الإيمايل أو رقم الهاتف"
                required
            >

        </div>


        <!-- كلمة المرور -->

        <div class="field">

            <label id="passwordLabel" for="password">
                كلمة المرور
            </label>

            <div class="input-wrap">

                <input
                    id="password"
                    class="input password"
                    type="password"
                    autocomplete="new-password"
                    placeholder="أنشئ كلمة مرور"
                    required
                >

                <button
                    type="button"
                    id="showPassword"
                    class="show"
                >
                    إظهار
                </button>

            </div>

        </div>


        <!-- تأكيد كلمة المرور -->

        <div class="field">

            <label id="confirmLabel" for="confirmPassword">
                تأكيد كلمة المرور
            </label>

            <div class="input-wrap">

                <input
                    id="confirmPassword"
                    class="input password"
                    type="password"
                    autocomplete="new-password"
                    placeholder="أعد كتابة كلمة المرور"
                    required
                >

                <button
                    type="button"
                    id="showConfirm"
                    class="show"
                >
                    إظهار
                </button>

            </div>

        </div>


        <button
            id="signupButton"
            type="submit"
            class="signup-btn"
        >
            إنشاء حساب
        </button>

    </form>


    <div id="message" class="message"></div>


    <button
        id="backButton"
        class="back"
        type="button"
        onclick="window.location.href='signin.html'"
    >
        لدي حساب بالفعل
    </button>


    <div class="footer">
        © Alislamiah Tube
    </div>

</div>


<script>

/* =========================================================
   التخزين
   ========================================================= */

const ACCOUNTS_KEY =
    "alislamiah_tube_accounts";

const LANGUAGE_KEY =
    "alislamiah_tube_language";


/* =========================================================
   عناصر الصفحة
   ========================================================= */

const language =
    document.getElementById("language");

const nameInput =
    document.getElementById("name");

const identifier =
    document.getElementById("identifier");

const password =
    document.getElementById("password");

const confirmPassword =
    document.getElementById("confirmPassword");

const showPassword =
    document.getElementById("showPassword");

const showConfirm =
    document.getElementById("showConfirm");

const form =
    document.getElementById("signupForm");

const message =
    document.getElementById("message");


/* =========================================================
   الترجمات
   ========================================================= */

const translations = {

    ar:{
        dir:"rtl",
        subtitle:"إنشاء حساب جديد",
        name:"الاسم",
        namePlaceholder:"أدخل اسمك",
        identifier:"الإيمايل أو الهاتف",
        identifierPlaceholder:"الإيمايل أو رقم الهاتف",
        password:"كلمة المرور",
        passwordPlaceholder:"أنشئ كلمة مرور",
        confirm:"تأكيد كلمة المرور",
        confirmPlaceholder:"أعد كتابة كلمة المرور",
        show:"إظهار",
        hide:"إخفاء",
        signup:"إنشاء حساب",
        back:"لدي حساب بالفعل",

        required:"يرجى ملء جميع الحقول.",
        mismatch:"كلمتا المرور غير متطابقتين.",
        short:"يجب أن تكون كلمة المرور 6 أحرف على الأقل.",
        exists:"هذا الإيمايل أو رقم الهاتف مسجل بالفعل.",
        success:"تم إنشاء الحساب بنجاح. سيتم تحويلك إلى تسجيل الدخول."
    },

    en:{
        dir:"ltr",
        subtitle:"Create a new account",
        name:"Name",
        namePlaceholder:"Enter your name",
        identifier:"Email or phone",
        identifierPlaceholder:"Email or phone number",
        password:"Password",
        passwordPlaceholder:"Create a password",
        confirm:"Confirm password",
        confirmPlaceholder:"Enter the password again",
        show:"Show",
        hide:"Hide",
        signup:"Create account",
        back:"I already have an account",

        required:"Please fill in all fields.",
        mismatch:"The passwords do not match.",
        short:"Password must be at least 6 characters.",
        exists:"This email or phone number is already registered.",
        success:"Account created successfully. Redirecting to sign in..."
    },

    fr:{
        dir:"ltr",
        subtitle:"Créer un nouveau compte",
        name:"Nom",
        namePlaceholder:"Entrez votre nom",
        identifier:"E-mail ou téléphone",
        identifierPlaceholder:"E-mail ou numéro de téléphone",
        password:"Mot de passe",
        passwordPlaceholder:"Créez un mot de passe",
        confirm:"Confirmer le mot de passe",
        confirmPlaceholder:"Saisissez à nouveau le mot de passe",
        show:"Afficher",
        hide:"Masquer",
        signup:"Créer un compte",
        back:"J'ai déjà un compte",

        required:"Veuillez remplir tous les champs.",
        mismatch:"Les mots de passe ne correspondent pas.",
        short:"Le mot de passe doit contenir au moins 6 caractères.",
        exists:"Cet e-mail ou numéro de téléphone est déjà enregistré.",
        success:"Compte créé avec succès. Redirection vers la connexion..."
    }

};


/* =========================================================
   تطبيق اللغة
   ========================================================= */

function applyLanguage(lang){

    const t =
        translations[lang] || translations.ar;

    document.documentElement.lang = lang;
    document.documentElement.dir = t.dir;

    document.getElementById("subtitle").textContent =
        t.subtitle;

    document.getElementById("nameLabel").textContent =
        t.name;

    nameInput.placeholder =
        t.namePlaceholder;

    document.getElementById("identifierLabel").textContent =
        t.identifier;

    identifier.placeholder =
        t.identifierPlaceholder;

    document.getElementById("passwordLabel").textContent =
        t.password;

    password.placeholder =
        t.passwordPlaceholder;

    document.getElementById("confirmLabel").textContent =
        t.confirm;

    confirmPassword.placeholder =
        t.confirmPlaceholder;

    document.getElementById("signupButton").textContent =
        t.signup;

    document.getElementById("backButton").textContent =
        t.back;

    showPassword.textContent =
        password.type === "password"
        ? t.show
        : t.hide;

    showConfirm.textContent =
        confirmPassword.type === "password"
        ? t.show
        : t.hide;

    localStorage.setItem(
        LANGUAGE_KEY,
        lang
    );
}


/* اللغة السابقة */

const savedLanguage =
    localStorage.getItem(LANGUAGE_KEY) || "ar";

language.value =
    savedLanguage;

applyLanguage(savedLanguage);


language.addEventListener("change",function(){

    applyLanguage(language.value);

});


/* =========================================================
   إظهار كلمة المرور
   ========================================================= */

showPassword.addEventListener("click",function(){

    const t =
        translations[language.value];

    if(password.type === "password"){

        password.type = "text";
        showPassword.textContent = t.hide;

    }else{

        password.type = "password";
        showPassword.textContent = t.show;

    }

});


showConfirm.addEventListener("click",function(){

    const t =
        translations[language.value];

    if(confirmPassword.type === "password"){

        confirmPassword.type = "text";
        showConfirm.textContent = t.hide;

    }else{

        confirmPassword.type = "password";
        showConfirm.textContent = t.show;

    }

});


/* =========================================================
   قراءة الحسابات
   ========================================================= */

function getAccounts(){

    try{

        return JSON.parse(
            localStorage.getItem(ACCOUNTS_KEY) || "[]"
        );

    }catch(error){

        return [];

    }

}


/* =========================================================
   إنشاء الحساب
   ========================================================= */

form.addEventListener("submit",function(event){

    event.preventDefault();

    const t =
        translations[language.value];

    const name =
        nameInput.value.trim();

    const user =
        identifier.value.trim();

    const pass =
        password.value;

    const confirm =
        confirmPassword.value;


    if(!name || !user || !pass || !confirm){

        showMessage(t.required,"error");

        return;

    }


    if(pass.length < 6){

        showMessage(t.short,"error");

        return;

    }


    if(pass !== confirm){

        showMessage(t.mismatch,"error");

        return;

    }


    let accounts =
        getAccounts();


    const normalizedUser =
        user.toLowerCase().trim();


    const exists =
        accounts.some(account =>
            String(account.identifier || "")
            .toLowerCase()
            .trim()
            === normalizedUser
        );


    if(exists){

        showMessage(t.exists,"error");

        return;

    }


    /* إنشاء الحساب */

    const account = {

        id:Date.now(),

        name:name,

        identifier:user,

        password:pass,

        createdAt:new Date().toISOString()

    };


    accounts.unshift(account);


    localStorage.setItem(
        ACCOUNTS_KEY,
        JSON.stringify(accounts)
    );


    showMessage(t.success,"success");


    /*
      لا يتم حفظ كلمة المرور في صفحة
      saved.passwords.html تلقائياً.

      المستخدم يختار ذلك من صفحة تسجيل الدخول.
    */


    setTimeout(function(){

        window.location.href =
            "signin.html";

    },1500);

});


/* =========================================================
   الرسائل
   ========================================================= */

function showMessage(text,type){

    message.textContent = text;

    message.className =
        "message " + type;

    message.style.display =
        "block";

}

</script>

</body>
</html>
