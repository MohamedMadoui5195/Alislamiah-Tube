<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنشاء حساب - Alislamiah Tube</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Arial,sans-serif}
body{background:#0d0d12;color:#fff;min-height:100vh;display:flex;justify-content:center;align-items:center}

/* نفس الخلفية الشعاعية الحمراء لمنصة Alislamiah Tube */
.bg{position:fixed;inset:0;background:radial-gradient(circle at 15% 20%,rgba(255,0,0,.25),transparent 35%),radial-gradient(circle at 85% 25%,rgba(255,51,51,.15),transparent 30%),#0d0d12;z-index:0}

.container{position:relative;z-index:1;width:92%;max-width:400px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:28px;padding:40px 30px;backdrop-filter:blur(20px);box-shadow:0 25px 50px rgba(0,0,0,.5);text-align:center}

/* شعار Alislamiah Tube */
.logo{width:75px;height:75px;margin:0 auto 20px;border-radius:20px;background:linear-gradient(135deg,#ff0000,#cc0000);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;box-shadow:0 8px 25px rgba(255,0,0,.35)}

h1{font-size:24px;margin-bottom:6px}
.subtitle{color:#aaaaaa;font-size:14px;margin-bottom:28px}
.input-group{margin-bottom:16px;text-align:right}
.input-group label{display:block;font-size:13px;color:#bbbbbb;margin-bottom:6px}
.input-group input{width:100%;padding:14px;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.12);border-radius:12px;color:#fff;font-size:15px;outline:none}
.input-group input:focus{border-color:#ff0000}

/* زر إنشاء الحساب */
.btn{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,#ff0000,#cc0000);color:#fff;font-size:16px;font-weight:700;cursor:pointer;margin-top:8px}
.message{margin-top:14px;font-size:14px;min-height:20px}
.message.error{color:#ff6b6b}.message.success{color:#4ade80}
.links{margin-top:22px;font-size:14px;color:#aaaaaa}
.links a{color:#ff0000;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<div class="bg"></div>

<div class="container">
  <div class="logo">Tube</div>
  <h1>إنشاء حساب جديد</h1>
  <p class="subtitle">انضم إلينا في منصة الإسلامية تيوب</p>

  <div class="input-group">
    <label>الاسم الكامل</label>
    <input type="text" id="username" placeholder="اسمي الكامل">
  </div>

  <div class="input-group">
    <label>البريد الإلكتروني</label>
    <input type="email" id="email" placeholder="example@email.com">
  </div>

  <div class="input-group">
    <label>كلمة المرور</label>
    <input type="password" id="password" placeholder="••••••••">
  </div>

  <button class="btn" onclick="signup()">تسجيل الحساب</button>
  <div class="message" id="msg"></div>

  <div class="links">
    لديك حساب بالفعل؟ <a href="signin.html">تسجيل الدخول</a>
  </div>
</div>

<script>
  function getUsers() {
    return JSON.parse(localStorage.getItem("alislamiah_users") || "[]");
  }

  function signup() {
    const name = document.getElementById("username").value.trim();
    const email = document.getElementById("email").value.trim().toLowerCase();
    const password = document.getElementById("password").value;
    const msg = document.getElementById("msg");

    msg.textContent = "";
    msg.className = "message";

    // التحقق من ملء جميع الحقول
    if (!name || !email || !password) {
      msg.className = "message error";
      msg.textContent = "يرجى ملء جميع الحقول المطلوبة";
      return;
    }

    const users = getUsers();
    
    // التحقق مما إذا كان البريد الإلكتروني مسجلاً مسبقاً
    const userExists = users.some(u => u.email === email);
    if (userExists) {
      msg.className = "message error";
      msg.textContent = "هذا البريد الإلكتروني مسجل بالفعل";
      return;
    }

    // إضافة المستخدم الجديد إلى المصفوفة
    users.push({
      id: Date.now().toString(), // توليد معرف فريد يعتمد على الوقت
      name: name,
      email: email,
      password: password
    });

    // حفظ البيانات المحدثة محلياً
    localStorage.setItem("alislamiah_users", JSON.stringify(users));

    msg.className = "message success";
    msg.textContent = "تم إنشاء الحساب بنجاح! جاري تحويلك...";

    // التوجيه إلى صفحة تسجيل الدخول بعد ثانية واحدة
    setTimeout(() => {
      window.location.href = "signin.html";
    }, 1200);
  }

  // دعم الضغط على زر Enter لإتمام التسجيل
  document.getElementById("password").addEventListener("keypress", function(e) {
    if (e.key === "Enter") signup();
  });
</script>
</body>
</html>
