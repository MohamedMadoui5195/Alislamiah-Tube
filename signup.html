<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنشاء حساب - Alislamiah Tube</title>
<link rel="icon" href="icon.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Arial,sans-serif}
body{background:#07111f;color:#fff;min-height:100vh;display:flex;justify-content:center;align-items:center;position:relative}
.bg{position:fixed;inset:0;background:
  radial-gradient(circle at 15% 20%,rgba(111,183,255,.22),transparent 38%),
  radial-gradient(circle at 85% 30%,rgba(8,120,255,.18),transparent 35%),
  radial-gradient(circle at 50% 90%,rgba(20,80,160,.12),transparent 40%),
  #07111f;z-index:0}
.container{position:relative;z-index:1;width:92%;max-width:400px;background:rgba(11,26,44,.85);border:1px solid #173553;border-radius:24px;padding:40px 28px 32px;backdrop-filter:blur(16px);box-shadow:0 25px 50px rgba(0,0,0,.45);text-align:center;animation:fadeUp .55s ease-out}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.logo{width:72px;height:72px;margin:0 auto 18px;border-radius:18px;overflow:hidden;background:linear-gradient(135deg,#087fff,#6fb7ff);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 28px rgba(8,127,255,.4)}
.logo img{width:100%;height:100%;object-fit:cover}
.logo span{font-size:22px;font-weight:800;color:#fff}
h1{font-size:22px;font-weight:700;margin-bottom:6px;color:#f5f9ff}
.subtitle{color:#718ba6;font-size:14px;margin-bottom:26px;line-height:1.5}
.input-group{margin-bottom:14px;text-align:right}
.input-group label{display:block;font-size:13px;color:#8aa4c0;margin-bottom:6px}
.input-group input{width:100%;padding:14px 15px;background:rgba(255,255,255,.06);border:1.5px solid #1e3a55;border-radius:12px;color:#fff;font-size:15px;outline:none;transition:.25s}
.input-group input:focus{border-color:#6fb7ff;background:rgba(111,183,255,.08);box-shadow:0 0 0 3px rgba(111,183,255,.15)}
.btn{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,#087fff,#3d9cff);color:#fff;font-size:16px;font-weight:700;cursor:pointer;margin-top:6px;box-shadow:0 6px 20px rgba(8,127,255,.35);transition:.25s}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(8,127,255,.45)}
.message{margin-top:14px;font-size:14px;min-height:20px}
.message.error{color:#ff6b6b}.message.success{color:#4ade80}
.links{margin-top:20px;font-size:14px;color:#718ba6}
.links a{color:#6fb7ff;text-decoration:none;font-weight:600}
.footer-note{margin-top:18px;font-size:12px;color:#5a7390}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;justify-content:center;align-items:center;z-index:100}
.modal-overlay.show{display:flex}
.modal{background:#0b1a2c;border:1px solid #173553;border-radius:20px;padding:26px;width:90%;max-width:360px;text-align:center}
.modal h3{margin-bottom:10px;font-size:17px}
.modal p{color:#8aa4c0;font-size:14px;margin-bottom:20px;line-height:1.5}
.modal-btns{display:flex;gap:10px}
.modal-btns button{flex:1;padding:12px;border:none;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer}
.btn-yes{background:linear-gradient(135deg,#087fff,#3d9cff);color:#fff}
.btn-no{background:rgba(255,255,255,.08);color:#ccc}
</style>
</head>
<body>
<div class="bg"></div>

<div class="container">
  <div class="logo">
    <img src="icon.png" alt="Tube" onerror="this.style.display='none';this.parentElement.innerHTML='▶️'">
  </div>
  <h1>إنشاء حساب جديد</h1>
  <p class="subtitle">انضم إلى منصة الفيديوهات الإسلامية<br>Alislamiah Tube</p>

  <div class="input-group">
    <label>الاسم</label>
    <input type="text" id="name" placeholder="اسمك" autocomplete="name">
  </div>

  <div class="input-group">
    <label>البريد الإلكتروني</label>
    <input type="email" id="email" placeholder="example@email.com" autocomplete="email">
  </div>

  <div class="input-group">
    <label>كلمة المرور</label>
    <input type="password" id="password" placeholder="6 أحرف على الأقل" autocomplete="new-password">
  </div>

  <div class="input-group">
    <label>تأكيد كلمة المرور</label>
    <input type="password" id="password2" placeholder="أعد كتابة كلمة المرور" autocomplete="new-password">
  </div>

  <button class="btn" onclick="signup()">إنشاء الحساب</button>
  <div class="message" id="msg"></div>

  <div class="links">
    لديك حساب بالفعل؟ <a href="signin.html">تسجيل الدخول</a>
  </div>
  <p class="footer-note">الحساب يعمل أيضاً على Alislamiah AI تلقائياً</p>
</div>

<!-- سؤال حفظ كلمة المرور -->
<div class="modal-overlay" id="saveModal">
  <div class="modal">
    <h3>هل تريد حفظ كلمة المرور؟</h3>
    <p>سيتم حفظها لتتمكن من استرجاعها لاحقاً من صفحة كلمات المرور المحفوظة.</p>
    <div class="modal-btns">
      <button class="btn-yes" onclick="saveYes()">نعم، احفظها</button>
      <button class="btn-no" onclick="saveNo()">لا</button>
    </div>
  </div>
</div>

<script>
  const USERS_KEY = "alislamiah_users";
  const CURRENT_KEY = "alislamiah_current_user";
  const SAVED_KEY = "alislamiah_saved_passwords";

  let tempData = null;

  function getUsers() {
    try { return JSON.parse(localStorage.getItem(USERS_KEY) || "[]"); }
    catch { return []; }
  }

  function saveUsers(users) {
    localStorage.setItem(USERS_KEY, JSON.stringify(users));
  }

  function setCurrentUser(user) {
    localStorage.setItem(CURRENT_KEY, JSON.stringify(user));
  }

  function getSavedPasswords() {
    try { return JSON.parse(localStorage.getItem(SAVED_KEY) || "[]"); }
    catch { return []; }
  }

  // إذا كان مسجلاً مسبقاً
  if (localStorage.getItem(CURRENT_KEY)) {
    window.location.href = "index.html";
  }

  function signup() {
    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim().toLowerCase();
    const password = document.getElementById("password").value;
    const password2 = document.getElementById("password2").value;
    const msg = document.getElementById("msg");

    msg.className = "message";
    msg.textContent = "";

    if (!name || !email || !password || !password2) {
      msg.className = "message error";
      msg.textContent = "يرجى ملء جميع الحقول";
      return;
    }

    if (password.length < 6) {
      msg.className = "message error";
      msg.textContent = "كلمة المرور يجب أن تكون 6 أحرف على الأقل";
      return;
    }

    if (password !== password2) {
      msg.className = "message error";
      msg.textContent = "كلمتا المرور غير متطابقتين";
      return;
    }

    const users = getUsers();
    if (users.find(u => u.email === email)) {
      msg.className = "message error";
      msg.textContent = "هذا البريد مستخدم بالفعل";
      return;
    }

    const newUser = {
      id: Date.now(),
      name: name,
      email: email,
      password: password
    };

    users.push(newUser);
    saveUsers(users);

    tempData = { name, email, password };
    setCurrentUser({ id: newUser.id, name, email });

    document.getElementById("saveModal").classList.add("show");
  }

  function saveYes() {
    if (tempData) {
      const saved = getSavedPasswords();
      const exists = saved.find(s => s.email === tempData.email && s.site === "Alislamiah Tube");
      if (!exists) {
        saved.unshift({
          name: tempData.name,
          email: tempData.email,
          password: tempData.password,
          site: "Alislamiah Tube",
          savedAt: new Date().toISOString()
        });
        localStorage.setItem(SAVED_KEY, JSON.stringify(saved));
      }
    }
    document.getElementById("saveModal").classList.remove("show");
    window.location.href = "index.html";
  }

  function saveNo() {
    document.getElementById("saveModal").classList.remove("show");
    window.location.href = "index.html";
  }

  document.getElementById("password2").addEventListener("keypress", function(e) {
    if (e.key === "Enter") signup();
  });
</script>
</body>
</html>
