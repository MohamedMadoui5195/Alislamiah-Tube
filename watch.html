<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عرض الفيديو - Alislamiah-Tube</title>
  <!-- استدعاء الأيقونة الصحيح من الواجهة مباشرة ✅ -->
  <link rel="icon" href="icon.png" type="image/png">
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Cairo',sans-serif;background:#0f0f0f;color:#fff;min-height:100vh;padding-bottom:80px}
    .header{background:#1a1a1a;padding:12px 20px;position:sticky;top:0;z-index:100;border-bottom:1px solid #333;display:flex;align-items:center;gap:12px}
    .app-icon{width:42px;height:42px;border-radius:10px;object-fit:cover}
    .header h1{font-size:1.4rem;font-weight:700;color:#4ade80}
    .main-content{padding:20px;max-width:800px;margin:0 auto}
    
    /* تنسيق مشغل الفيديو */
    .video-container {width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;margin-bottom:15px}
    .video-container video {width:100%;height:100%;object-fit:contain}
    
    .video-title{font-size:1.3rem;font-weight:700;line-height:1.4;margin-bottom:8px;color:#fff}
    .video-meta{font-size:0.9rem;color:#888;margin-bottom:20px}
    
    .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#1a1a1a;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #333;z-index:100}
    .nav-item{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:#888;font-size:0.8rem;gap:4px}
    .nav-item.active{color:#4ade80}
    .nav-item .icon{font-size:1.4rem}
  </style>
</head>
<body>
  <header class="header">
    <img src="icon.png" class="app-icon" alt="Alislamiah-Tube Icon">
    <h1>Alislamiah-Tube</h1>
  </header>

  <main class="main-content">
    <!-- مشغل الفيديو مع تفعيل أزرار التحكم والتشغيل التلقائي الذكي ✅ -->
    <div class="video-container">
      <video id="main-player" controls autoplay playsinline>
        <source id="video-source" src="" type="video/mp4">
        متصفحك لا يدعم تشغيل هذا الفيديو.
      </video>
    </div>

    <!-- عنوان الفيديو والناشر يتغيران تلقائياً ✅ -->
    <h1 id="video-display-title" class="video-title">جاري تحميل الفيديو...</h1>
    <div class="video-meta">منصة Alislamiah-Tube القياسية</div>
  </main>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item"><span class="icon">🏠</span><span>الرئيسية</span></a>
    <a href="search.html" class="nav-item"><span class="icon">🔍</span><span>البحث</span></a>
    <a href="https://google.com" target="_blank" class="nav-item"><span class="icon">✨</span><span>Gemini</span></a>
  </nav>

  <!-- السكريبت المسؤول عن استقبال الفيديو وتغيير المحتوى ديناميكياً ✅ -->
  <script>
    // 1. جلب اسم الفيديو والعنوان الممررين من الرابط
    const urlParams = new URLSearchParams(window.location.search);
    const videoFile = urlParams.get('v');
    const videoTitle = urlParams.get('title');

    const player = document.getElementById('main-player');
    const source = document.getElementById('video-source');
    const titleElement = document.getElementById('video-display-title');

    // 2. تحديث مشغل الفيديو إذا كان الرابط يحتوي على ملف ميديا
    if (videoFile) {
        source.src = videoFile; // تعيين مسار ملف الـ mp4 المرفوع في الريبو مباشرة
        player.load();          // تحديث المشغل بالملف الجديد
        player.play().catch(error => {
            console.log("المتصفح يمنع التشغيل التلقائي بصوت، يحتاج إلى كتم أو تفاعل من المستخدم أولاً.");
        });
    } else {
        titleElement.innerText = "خطأ: لم يتم اختيار أي فيديو لعرضه!";
    }

    // 3. تحديث نصوص العناوين وتبويب الموقع
    if (videoTitle) {
        const decodedTitle = decodeURIComponent(videoTitle);
        titleElement.innerText = decodedTitle;
        document.title = decodedTitle + " - Alislamiah-Tube";
    }
  </script>
</body>
</html>
